yelo.shieldplus.firstp.text.en=safety is the number one priority, enjoy our hassle-free and safe on roads services. Add Yelo Shield Plus to your contract and exclude yourself from any extra costs in case of any damages or harm* and enjoy a journey with a total peace-of-mind.
yelo.shieldplus.firstp.text.ar=درع يلو هو منتج تقدمه شركة يلو لعملائها مقابل مبلغ مالي يضاف الى قيمة الإيجار اليومي للسيارة خلال فترة عقد التأجير، بحيث يعفي* هذا المبلغ مستأجر السيارة من دفع قيمة تحمل الحادث في حال حدوثه، لا قدر الله، و تختلف قيمة هذه الخدمة بحسب فئة السيارة المستأجرة. إذا رغب العميل الإستفادة من هذه الخدمة، يجب عليه طلب إضافتها الى عقد الإستئجارعند فتح العقد فقط، حيث لا يمكن إضافتها بعد ذلك. للمزيد من العلومات، يمكن التواصل مع مركز خدمة العملاء على الرقم 8001000014
yelo.shieldplus.firstp.img.byxpath=(//following-sibling::div//img[contains(@src,'YeloShield')])[2]
yelo.shieldplus.secondp.title.text.en=Yelo Shield Plus
yelo.shieldplus.secondp.title.text.ar=درع يلو بلس
yelo.shieldplus.secondp.text.en=Yelo Shield Plus, a premium and enhanced additional protection product for the customers complete peace of mind. With super coverage and additional features, Yelo Shield plus service gives you a waiver for any accident premiums that would apply at the time of an accident, God Forbid.\nYelo Shield Plus is an additional product that is offered to customers for a small amount of money added to the rent. This amount varies from one category to another.\nIt is only available at the time of opening the contract, and it will not be available at later stage.
yelo.shieldplus.secondp.text.ar=درع يلو بلس هو منتج جديد و خدمة رائعة ومميزة تم إضافتها بما يتناسب مع عملائنا ويضمن لهم راحة البال ، درع يلو بلس يضمن للعميل عدم تحمل أي مبالغ في حالة التلفيات و الحوادث والتلفيات الناتجة عن سوء الأحوال الجوية لا سمح الله .\nدرع يلو بلس هو منتج إضافي يتم تقديمة للعملاء مقابل مبلغ مالي بسيط يضاف إلى قيمة الإيجار ويختلف هذا المبلغ من فئة إلى آخرى .\nيتم طلب الخدمة وقت فتح العقد ولا يمكن إضافتة فيما بعد
