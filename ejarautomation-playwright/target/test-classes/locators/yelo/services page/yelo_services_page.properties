alyam.services.servicesTitle.text.en=Our Services
alyam.services.servicesTitle.text.ar=خدماتنا

alyam.services.firstP.text.en=Welcome to Al Yam Rent a Car, where we aim to provide a seamless and enjoyable car rental experience for our customers. Whether you
alyam.services.firstP.text.ar=مرحبًا بكم في اليم لتأجير السيارات، حيث نسعى لتقديم تجربة تأجير سيارات ممتعة واستثنائية لعملائنا. سواء كنت تسافر بغرض العمل، الترفيه، أو لأي سبب آخر، فإن مجموعتنا الواسعة من السيارات ستلبي احتياجاتك.

alyam.services.secondP.text.en=We offer flexible rental plans with daily and monthly options, making it easy to find a plan that suits your schedule by booking through our website or mobile app.
alyam.services.secondP.text.ar=نقدم خيارات مرنة للتأجير اليومي، الأسبوعي والشهري حسب ما يتناسب مع متطلباتك من خلال الحجز عبر الموقع الإلكتروني أو التطبيق.

alyam.services.thirdP.text.en=Take advantage of our special offers and discounts, including loyalty programs and seasonal promotions ensuring you get the best deal.
alyam.services.thirdP.text.ar=كما يمكنك الاستفادة من عروضنا وخصوماتنا متضمنة برامج الولاء و العروض الموسمية لضمان حصولك على أفضل العروض.

alyam.services.forthP.text.en=At Al Yam, we take immense pride in providing you with top-notch service, ensuring your safety and comfort. Should you have any questions or require assistance, our dedicated team is always here to help.
alyam.services.forthP.text.ar=في اليم، نفخر بتقديم خدمة عالية الجودة لضمان سلامتك وراحتك. إذا كان لديك أي استفسارات أو تحتاج إلى مساعدة، فإن فريقنا المتفاني متواجد لمساعدتك.

