yelo.executebooking.firstp.text.en=Because safety is the number one priority, enjoy our hassle-free and safe on roads services. Add Yelo Shield Plus to your contract and exclude yourself from any extra costs in case of any damages or harm* and enjoy a journey with a total peace-of-mind.
yelo.executebooking.firstp.text.ar=تقدم شركة يلو لعملائها الأفراد خدمة من الدرجة الاولى و التي تسهل اجراءات استلامهم للسيارة في اسرع وقت ممكن.\nيمكن لعملائنا الاستمتاع بتجربة استئجار سيارة من خلال زيارة اي من فروعنا الموزعة في خمسة مناطق رئيسية في المملكة العربية السعودية, بالاضافة الى موقعين في كل من مطار دبي الدولي و مطار الشارقة الدولي في دولة الامرات العربية المتحدة و التي تمكنهم من اختيار السيارة المناسبة من اسطول متنوع من السيارات في غضون دقائق.\nو لتوفير افضل وسائل الراحة لعملائنا, تقدم شركة يلو خدمة ارجاع السيارةالمستأجررة في اي فرع من شبكة فروع الشركة و الاستمتاع بأفضل العروض الخاصة.
