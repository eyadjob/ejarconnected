yelo.services.shippingservicetitle.text.en=Shipping between cities
yelo.services.shippingservice.text.en=Planning for a trip? Don’t worry, with the Shipping between Cities service you can enjoy dropping your car off at any of our branches, we will take care of the rest.
yelo.services.shippingservice.text.ar=سافر واستمتع بكل سهولة مع خدمة الشحن بين المدن التي تتيح لك تسليم سيارتك بأي فرع من فروعنا في أي مدينة تريد حتى تحصل على أفضل تجربة سفر مع أسطولنا المميز
yelo.services.yeloshieldplustitle.text.en=Yelo Shield Plus
yelo.services.yeloshieldplus.text.en=Because safety is the number one priority, enjoy our hassle-free and safe on roads services. Add Yelo Shield Plus to your contract and exclude yourself from any extra costs in case of any damages or harm* and enjoy a journey with a total peace-of-mind.
yelo.services.yeloshieldplus.text.ar=أن سلامتك هي أولويتنا، يلو معك على طول الطريق!  أضف خدمة درع  يلو بلس لعقدك لتفادي  أي مبالغ إضافية ناتجة عن تلفيات أو حوادث لا قدر الله
