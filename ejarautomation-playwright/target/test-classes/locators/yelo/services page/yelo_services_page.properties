yelo.services.carRentalServices.text.en=Car rental Services
yelo.services.carRentalServices.text.ar=خدمات تأجير السيارات
yelo.services.firstsectiontext.text.en=Whether you need daily car rentals, monthly car rentals or long term leasing, we are able to provide you the car that fits your needs. We provide our customers with a great variety of cars from the most renowned vehicle brands in the world. Our diverse fleet includes brands such as, Lexus, Mercedes, BMW, Chevrolet, Hyundai, Ford, Genesis and Changan. We have +27 000 cars ranging: economic, premium, luxury, SUV, Pick up and Mini-van & bus.
yelo.services.firstsectiontext.text.ar=تفخر يلو بتقديم مجموعة متنوعة من الخدمات لتتناسب مع جميع احتياجات العملاء، حيث ان لدينا أسطول رائع يحتوي على  أكثر من 27000 سيارة متنوعة من أحدث السيارات والموديلات العالمية من جميع الأنواع والفئات وبأسعار تنافسية، مع الحرص على تقديم خدمات متميزة لمواكبة أحدث الخدمات في سوق تأجير السيارات العالمي.
yelo.services.excutebookingtitle.text.en=Execute Booking
yelo.services.excutebookingtitle.text.ar=خدمة تنفيذ الحجز
yelo.services.excutebooking.text.en=Exclusively through the Yelo app, execute your booking save your time with hassle-free and minimal paperwork procedures, and start your trip earlier.
yelo.services.excutebooking.text.ar=: حصريًا عبر تطبيق يلو، من خلال خدمة تنفيذ الحجز، اختصر وقتك وتمتع بإجراءات أقل لتبدأ رحلتك مبكرًا.
