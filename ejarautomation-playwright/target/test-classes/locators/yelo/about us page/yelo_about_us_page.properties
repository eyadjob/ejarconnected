yelo.aboutus.quality.text.en=Quality
yelo.aboutus.quality.text.ar=الجودة
yelo.aboutus.qualityDesc.text.en=We will place the interests of our customers first. We will be dedicated to providing an individualized rental experience that assure customers satisfaction and earns the unwavering loyalty of our customers. We will ensure that the "Your comfort begins with our services" philosophy underlies everything we do and shines through in or service to customers.
yelo.aboutus.qualityDesc.text.ar=توفير فرص للتطور والرقي الوظيفي لفرق العمل الذين يظهرون تقدمًا في قدراتهم وكفاءاتهم الوظيفية والتي تمكنهم من إدارة أعمالهم بشكل فعال؛ لتحقيق أقصى استفادة من إمكانياتهم الوظيفية.
yelo.aboutus.teamWork.img.byxpath=//img[contains(@src, 'team-work.svg')]
yelo.aboutus.teamWork.h.byxpath=//div[@id='teamwork']/h2
yelo.aboutus.teamWork.text.en=Teamwork
yelo.aboutus.teamWork.text.ar=العمل الجماعي
yelo.aboutus.teamWorkDesc.text.en=We will work as one cohesive team from the smallest unit to the organization as a whole. We will develop and retain leaders who continually raise the bar, provide direction, remove barriers and empower people to successfully accomplish goals. We will maintain a caring and supportive work environment that fosters a sharing of ideas, skills and resources.
yelo.aboutus.teamWorkDesc.text.ar=نعمل جميعاً كفريق واحد متماسك من أصغر وحدة إلى المنظمة ككل. الحفاظ على القادة المتفوقين في أدائهم وإزالة الحواجز بين فريق العمل وتمكين الجميع من تحقيق أهداف الشركة بنجاح. توفير بيئة عمل ملائمة تقدم الرعاية والدعم اللازم لتبادل الأفكار والمهارات والموارد.
yelo.aboutus.growth.img.byxpath=//img[contains(@src, 'growth.svg')]
yelo.aboutus.growth.text.en=Growth
yelo.aboutus.growth.text.ar=النمو والربحية
yelo.aboutus.growthDesc.text.en=We will be dedicated to continues innovation and pursue new ideas and opportunities to accelerate profitable growths. We will deliver value in all we do to assure consistently high returns to our shareholders. We will recognize and reward excellent performance, which drives superior results.
yelo.aboutus.growthDesc.text.ar=نحن حريصون على الابتكار الدائم وتبني الأفكار الجديدة واستغلال الفرص المتاحة لتسريع وتيرة نمو الأرباح. إدارة العمل باحترافية لضمان عائدات عالية على الدوام لمساهمينا. تقدير وتكريم ذوي الأداء المتميز مما ينعكس إيجابياً على نمو الشركة وزيادة إنتاجيتها.
yelo.aboutus.community.img.byxpath=//img[contains(@src, 'community.svg')]
yelo.aboutus.community.text.en=Community
yelo.aboutus.community.text.ar=الجودة
yelo.aboutus.communityDesc.text.en=We will be active participants in our communities and encourage employee involvement in civic and charitable activities. We will be role model business leaders in the countries and communities in which we operate. We will develop and implement business practices consistent with safeguarding the environment.
yelo.aboutus.communityDesc.text.ar=وضع مصلحة عملائنا في المقام الأول. الالتزام بتقديم خدمة تأجير تضمن كسب رضا العملاء. التأكيد على شعارنا (راحتكم تبدأ مع خدماتنا) والذي يبرز كل ما نقوم به في خدمة عملائنا
