yelo.aboutus.title.text.en=About Yelo
yelo.aboutus.title.text.ar=من يلو
yelo.aboutus.foundyear.text.en=Yelo, formerly Al Wefaq rent a car, was founded in 2000.
yelo.aboutus.foundyear.text.ar=تأسست شركة يـلو ، الوفاق لتأجير السيارات سابقًا، في عام 2000.
yelo.aboutus.branchesInfo.text.en=Yelo is a regionally recognized brand with more than 80 branches in different cities and airports in the kingdom of Saudi Arabia, United Arab Emirates and Egypt. Because of our leadership, the entrepreneurial spirit of our employees, we have built one of the most reliable brands in the rent a car industry in KSA and the GCC.
yelo.aboutus.branchesInfo.text.ar=يـلو هي علامة تجارية معترف بها إقليمياً مع أكثر من 80 فرعًا في مدن ومطارات مختلفة في المملكة العربية السعودية والإمارات العربية المتحدة وجمهورية مصر العربية. بسبب رؤيتنا وتوجهاتنا الريادية وروح المبادرة والتميز لدى موظفينا، قمنا ببناء واحدة من أكثر العلامات التجارية موثوقية في تأجير السيارات في المملكة العربية السعودية ودول مجلس التعاون الخليجي. تنتشر خدماتنا في 18 فرعًا في المطارات وأكثر من 80 فرعًا في مدن المملكة العربية السعودية، بأسطول يضم اكثر 17,000 سيارة متنوع من أحدث السيارات المتوفرة في الأسواق من مختلف العلامات التجارية.
yelo.aboutus.ourVision.img.byxpath=//img[contains(@src, 'vision')]
yelo.aboutus.ourVisionTitle.text.en=Our Vision
yelo.aboutus.ourVisionTitle.text.ar=رؤيتنا
yelo.aboutus.ourVisionDesc.text.en=We go beyond the expected to surprise and delight your journey.
yelo.aboutus.ourVisionDesc.text.ar=تخطي توقعات وتطلعات عملائنا بإسعادهم وايصالهم الى الرضا التام في كل خطوة من خطوات رحلتهم معنا.
yelo.aboutus.ourMission.img.byxpath=//img[contains(@src, 'OurMISSION-New.png')]
yelo.aboutus.ourMissionTitle.text.en=Our Mission
yelo.aboutus.ourMissionTitle.text.ar=رسالتنا
yelo.aboutus.ourMissionDesc.text.en=We provide you the service that fits your need by considering every step in your journey and make it as relevant and personalized as possible.
yelo.aboutus.ourMissionDesc.text.ar=تقديم خدمة تأجير السيارات بشكل راق ومتحضر بعيداً عن الروتين المُضجر للعملاء من أجل مد جسور الثقة بيننا وبينهم من خلال تقديم أفضل ما لدينا من خدمات وتعاملات تغطي كافة احتياجاتهم الشخصية من أجل إيصال رسالة لهم بأن ( راحتكم تبدأ من خدماتنا) والجهد والإخلاص والمثابرة من أجل تحقيق التميز الذي ننشده.
