alyam.aboutus.title.text.en=About Us
alyam.aboutus.title.text.ar=من نحن

alyam.aboutus.firstP.p.byxpath=(//p[contains(@class,'First-P')])[1]
alyam.aboutus.firstP.text.en=Al Yam Rent a Car was founded more than twenty years ago with the aim of providing high-quality car rental services to customers in the Kingdom of Saudi Arabia. The company started with a few branches in the capital, Riyadh, but quickly grew and expanded to include more than 20 branches across the Kingdom.
alyam.aboutus.firstP.text.ar=تأسست شركة اليم منذ أكثر من عشرين سنه بهدف توفير خدمات تأجير السيارات عالية الجودة للعملاء في المملكة العربية السعودية. بدأت الشركة بفروع قليلة في العاصمة الرياض، لكنها سرعان ما نمت وتوسعت لتشمل أكثر من 20 فرعًا في جميع أنحاء المملكة.

alyam.aboutus.secondP.text.en=From the beginning, our focus has been on providing an easy and comfortable rental experience and offering our customers a wide variety of modern cars to suit their different needs. We always strive for excellence in customer service, offering exceptional service that exceeds our customers
alyam.aboutus.secondP.text.ar=منذ البداية، كان تركيزنا على تقديم تجربة تأجير سهله و مريحه و توفير لعملائنا مجموعة متنوعة من السيارات الحديثة التي تناسب احتياجاتهم المختلفة. نسعى دائمًا للتميز في خدمة العملاء، حيث نقدم خدمة استثنائية نتفوق بها على توقعات عملائنا.

alyam.aboutus.thirdP.p.byxpath=(//p[contains(@class,'First-P')])[3]
alyam.aboutus.thirdP.text.en=We believe in the importance of professionalism in every aspect of our work, from dealing with customers to vehicle maintenance. We care about transparency in our dealings and explain to each customer all the details related to services and prices, which enhances the trust between us and our customers.
alyam.aboutus.thirdP.text.ar=نحن نؤمن بأهمية الاحترافية في كل جانب من جوانب عملنا، من التعامل مع العملاء إلى صيانة السيارات. نهتم بالشفافية في تعاملاتنا، ونوضح لكل عميل كل التفاصيل المتعلقة بالخدمات والأسعار، مما يعزز الثقة بيننا وبين عملائنا.

alyam.aboutus.forthP.p.byxpath=(//p[contains(@class,'First-P')])[4]
alyam.aboutus.forthP.text.en=Al Yam Rent a Car continues to grow and prosper, reinforced by its strong reputation built over years of hard work and commitment to established values. We are proud to be the first choice for customers seeking reliable and distinguished rental services, and we always strive to offer the best in everything we do.
alyam.aboutus.forthP.text.ar=تستمر شركة اليم في النمو والازدهار، معززة بسمعتها القوية وسمعتها التي بُنيت على مدار سنوات من العمل الجاد والالتزام بالقيم الراسخة. نحن فخورون بأن نكون الخيار الأول للعملاء الذين يبحثون عن خدمات تأجير موثوقة ومميزة، ونسعى دائمًا لتقديم الأفضل في كل ما نقوم به.

