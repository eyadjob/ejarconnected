yelo.city.madinah.mainTitle.text.ar=تأجير السيارات في المدينة
yelo.city.madinah.title.text.en=Al Madinah Al Munawwarah (The Enlightened City)
yelo.city.madinah.title.text.ar=المدينة المنورة (طيبة الطيبة)
yelo.city.madinah.desc.text.en=It's the second holiest place in the kingdom after Makkah, making it a must-visit destination for Muslims from all around the globe. Madinah, also known as Al-Madinah Al-Munawwarah, offers a profound spiritual experience and a plethora of historical and cultural sites. Explore the magnificent Prophet's Mosque, Quba Mosque, and the historically significant Uhud Mount. To fully experience all that Madinah has to offer, rent a car in Madinah for the ultimate convenience and comfort. Don't miss the opportunity to discover every corner of this sacred city—start planning your visit and rent a car in Madinah today!
yelo.city.madinah.desc.text.ar=المدينة المنورة هي ثاني أقدس الأماكن لدى المسلمين بعد مكة المكرمة، ما يجعلها إحدى الوجهات الرئيسية لملايين المسلمين من مختلف أنحاء العالم. وحتى تتمكن من زيارة جميع المعالم المهمة في المدينة لا بد لك من التفكير في خدمات تأجير سيارات في المدينة المنورة التي تقدم لك الراحة في التنقل وبأسعار منافسة. تعرف على أسطولنا المخصص لتلبية جميع احتياجاتك مهما كانت، وانطلق في رحتلك بلا قيود.\nزر المسجد النبوي الشريف مع عائلتك بسيارة عائلية مميزة، تتسم بتوفير المساحة والراحة اللازمة.\nأو زر مسجد قباء بسيارة فردية موفرة للوقود.\nأو اذهب إلى مسجد أحد بسيارة تناسب المناطق الرملية\nأو اذهب إلى مكتب العمل خاصتك بسيارة فخمة تناسب توقعاتك\nاكتشف أسطول يلو الآن!
