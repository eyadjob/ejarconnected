yelo.city.hail.title.text.ar=حائل (عروس شمال نجد)
yelo.city.hail.desc.text.en=The city of Haʼil holds a rich history full of cultures, and still to this day, Haʼil enjoys a huge popularity. Unique for its surrounding countryside and monuments like the stone circles, ancient tools, and the arts of drawing and engraving.
yelo.city.hail.desc.text.ar=تملك مدينة حائل تاريخاً غنياً مليئًا بالحضارات ولا تزال وجهة تحظى بشعبية كبيرة إلى يومنا هذا، كما يميزها الريف المحيط بها والآثار مثل الدوائر الحجرية والأدوات القديمة وفن الرسم والنقش على الصخور.\nأفضل الأماكن للزيارة في حائل بالسيارة\nاستئجار سيارة في حائل يفتح لك أبواب استكشاف العديد من الوجهات السياحية بسهولة، مثل قلعة عيرف التاريخية التي تطل على المدينة وتوفر إطلالات بانورامية رائعة، وموقع جبة الأثري الذي يعد من أقدم المواقع الأثرية في المملكة. يمكنك أيضًا التوجه بسيارتك إلى حديقة السمراء للاستمتاع بالطبيعة الخلابة والأنشطة الترفيهية المناسبة للعائلات. بالإضافة إلى ذلك، السيارة تمنحك القدرة على زيارة منتزه المغواة الترفيهي وقضاء أوقات ممتعة مع الأطفال.
