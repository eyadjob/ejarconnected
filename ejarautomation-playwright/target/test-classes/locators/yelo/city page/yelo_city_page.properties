yelo.city.dammam.desc.text.en=Famous for its coastal areas, Al-Dammam is considered as one of the hottest destinations in the kingdom for tourism and vacations, with its coastal areas, desert, historic landmarks and heritage, it sure has a lot of options for its visitors.
yelo.city.dammam.desc.text.ar=الدمام ومناطقها الساحلية الجذابة تعتبر احدى اكبر المدن في المملكة العربية السعودية وتمتاز بسحر مناظرها الصحراوية والساحلية ومعالمها التاريخية والثقافية كما توفر خيارات عديدة لزائريها.
