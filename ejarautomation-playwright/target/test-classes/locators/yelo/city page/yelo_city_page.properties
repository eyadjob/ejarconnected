yelo.city.alUla.desc.text.en=The beauty of the desert with a blend of heritage and modernity. Al- 'Ula is famous for its archaeological wonders like the elephant mountain and mountain of Ikmah, on the other hand, its modernity shows in its mirror theater which is the perfect place to enjoy the Saudi heritage.
yelo.city.alUla.desc.text.ar=جمال الصحراء حيث التراث الجميل والحداثة .. تمتاز العلا باحتوائها على العجائب الأثرية منها صخرة الفيل وجبل عكمة، ومن ناحية الحداثة مسرح المرايا العلا هي المكان المثالي للاستمتاع بتراث المملكة العربية السعودية.
