yelo.city.jazan.title.text.en=Jazan (Full of Nature, Full of Heritage)
yelo.city.jazan.title.text.ar=جازان (الطبيعة والتراث)
yelo.city.jazan.desc.text.en=It won’t take long to know why it's famous for it's history, culture, and its well-known heritage. With Farasan island near it, it allows its visitors to dwell and enjoy its unique nature and coastal shores.
yelo.city.jazan.desc.text.ar=مهبط التاريخ والحضارة وتمتاز بتراثها الغني عن التعريف، تقع جزيرة فرسان على مقربة منها حيث يتيح ذلك لزوارها التمتع في طبيعتها وسواحلها الفريدة.
