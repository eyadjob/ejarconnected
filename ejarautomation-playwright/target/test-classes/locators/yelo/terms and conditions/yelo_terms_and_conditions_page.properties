alyam.termsofuse.trademarkP.text.en=We or our affiliates own registered service marks including, without limitation, "Alyam group", " Alyam ", "Alyam maintenance", "Alyam national transport",  "Alyam Car Sales,"  "Dollar Rent A CAR KSA" , Connect by Alyam and certain unregistered marks. Names, logos and other marks identifying our products or services are our or our affiliates' proprietary marks, and are protected by Kingdom of Saudi Arabia and international trademark laws. All other trademarks and service marks used on this website are the trademarks, service marks, or logos of their respective owners.
alyam.termsofuse.trademarkP.text.ar=الشركة تملك علامات الخدمة المسجلة وتشمل ولكنها ليست مقصورة على " مجموعة اليَم" و "اليَم" و" اليَم للصيانة" و " اليَم للنقل " و " اليَم لمبيعات السيارات" و" دولار لتأجير السيارات – المملكة العربية السعودية" كلها مرتبطة باليَم ، وبعض العلامات والأسماء والشعارات والعلامات التي تميز منتجاتنا مسجلة محمية بقوانين المملكة العربية السعودية والقوانين التجارية التي تحمي العلامة التجارية . والعلامات التجارية وعلامات الخدمة المستخدمة في الموقع لها مالكوها.
alyam.termsofuse.privacyTitle.text.en=Privacy
