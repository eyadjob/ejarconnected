alyam.termsofuse.privacyP.text.en=Any personally identifiable data about you which we collect from you on this website, including without limitation, personally identifiable data about you collected during any registration process as described below, is subject to the privacy policy that is applicable to this website.  For more information, please carefully review the applicable privacy policy, which is accessible via a link provided at the bottom of the homepage of this website.
alyam.termsofuse.privacyP.text.ar=أي معلومات تعريفية شخصية عنكم يتم الحصول عليها أثناء استخدامكم للموقع، وتشمل ولكنها ليست مقصورة على معلومات التعريف الشخصية التي يتم الحصول عليها في أثناء عملية التسجيل المفصلة أدناه، خاضعة لسياسة الخصوصية المطبقة في هذا الموقع. للمزيد من المعلومات الرجاء مراجعة سياسة الخصوصية المتبعة في هذا الموقع التي يمكن الوصول إليها عبر الرابط الموجود في الصفحة الرئيسية.
alyam.termsofuse.registrationTitle.text.en=Registration
alyam.termsofuse.registrationTitle.text.ar=التسجيل
alyam.termsofuse.registrationP.text.en= Access to some areas and use of some functions of this or our other websites may require you to be or become a participant in or a member of a particular Alyam loyalty program. When and if you register to become a participant or member, you agree to (a) provide accurate, current, and complete information about yourself as prompted by our registration form (including your e-mail address), and (b) to maintain and update your information (including your e-mail address) to keep it accurate, current, and complete. You acknowledge that, if any information provided by you is or becomes inaccurate, not current, or incomplete, we reserve the right to terminate your use of this website and related services. As part of the registration process, you may be asked to select a password. You will be responsible for the confidentiality and use of your password and any club or program identification number and agree not to transfer or resell your use of or access to this website to any third party. If you have reason to believe that your account with us is no longer secure, you must immediately notify us of the problem by clicking here. you are entirely responsible for maintaining the confidentiality of your password and loyalty program identification number, and you are entirely responsible for any and all activities (including reservations and purchases) that are conducted through your account. for more information regarding data security issues, please see the "data security" section of the privacy policy.
alyam.termsofuse.registrationP.text.ar=للوصول إلى بعض الأجزاء واستخدام بعض الوظائف في هذا الموقع والمواقع الأخرى يتطلب منكم أن تكونوا مشاركين أو أعضاء في برنامج (اليَم loyalty program ) واذا أردتم المشاركة أو نيل العضوية في البرنامج يتطلب الموافقة على (أ) اعطاء بيانات شخصية ودقيقة ومحدثة كما هي مطلوبة في النموذج الخاص بالتسجيل، (تشمل عنوان البريد الإلكتروني) (ب) المحافظة على تحديث بياناتكم (تشمل عنوان البريد الإلكتروني) لتكون دقيقة، ومحدثة، ومكتملة. وعليكم الاقرار بأن البيانات الخاصة بكم دقيقة، ومحدثة، ومكتملة ، فالبيانات الغير دقيقة، وغير محدثة، وغير مكتملة تمنحنا حق انهاء اشتراككم في الموقع والخدمات المتصلة به . وكجزء من عملية التسجيل هذه مطالبون باختيار كلمة مرور ، لذا فأنتم المسئولين الوحيدين عن سرية واستخدام كلمة المرور هذه أو أي اشتراك، أو برنامج تعريفي آخر ، وتوافقون على عدم تحويل أو اعادة بيع حق الاستخدام أو الوصول لأي طرف ثالث، وإذا كان لديكم سبب يدعوكم للإعتقاد بأن حسابكم معنا غير آمن ، يجب الابلاغ فوراً عن المشكلة بالنقر على (أنتم مسئولين مسئولية تامة عن الحفاظ على سرية كلمة المرور ورقم معرف البرنامج (تشمل أي حجوزات أو مشتروات) خلال حسابكم ) ، لمزيد من المعلومات الخاصة بقضايا البيانات الرجاء قراءة "أمن البيانات" بقسم سياسة الخصوصية.
