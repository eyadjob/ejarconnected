alyam.termsofuse.copyrightP.text.ar=كل ما في الموقع الالكتروني من صور ونصوص وبرامج وجميع مواد الموقع يمنع الاستخدام التجاري لها بدون موافقة مكتوبة باسم اليَم. مع الموافقة على عدم تغيير أو حذف أي من حقوق النشر، أو العلامات التجارية، أو أي ملكية مواد أخرى موجودة في الموقع أو تحميلها من الموقع كذلك، وتقرون بإنكم وباستخدامكم للموقع لا تطالبون بملكية حقوق أي من مواد الموقع.
