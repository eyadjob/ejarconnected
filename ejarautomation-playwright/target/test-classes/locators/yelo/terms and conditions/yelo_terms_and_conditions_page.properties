alyam.termsofuse.codeofconductP.bp4.text.en=Transmit (a) any content or information that is unlawful, fraudulent, threatening, abusive, libelous, defamatory, obscene, or otherwise objectionable, or infringes on our or any third party's intellectual property or other rights (b) any material, non-public information about us, any of our licensees or affiliates, or any third party without the authorization to do so (c) any trade secret of ours, any of our licensees or affiliates, or any third party or (d) any advertisements, solicitations, chain letters, pyramid schemes, investment opportunities, or other unsolicited commercial communication (except as otherwise expressly permitted by us)
alyam.termsofuse.codeofconductP.bp4.text.ar=الابلاغ عن (أ) أي محتوى أو معلومات غير قانونية،أ وتنطوي على غش، أو تهديد، أو اساءة، أو تشهير، أو فحش، أو أي شئ آخر قابل للاعتراض عليه ، أو التعدي على حقوق الملكية الفكرية التي هي ملك لنا أو ملك أي طرف ثالث أو أي حقوق أخرى (ب) أي مواد ، أو معلومات تخصنا ليست للنشر، أو تخص أي من حاملي رخصتنا، أو منسوبينا، أو أي طرف ثالث بدون تفويض بذلك. (د) أي اعلانات ، أو حملات ترويج ، أو سلسلة خطابات، أو مخططات مشاريع، أو فرص استثمار، أو أي اتصالات تجارية (عدا ما نسمح به صراحة).
