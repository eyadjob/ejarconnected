alyam.termsofuse.codeofconductP.bp5.text.ar=عدم ارسال أي رسائل إلكترونية خطرة أو غير مرغوب فيها.
alyam.termsofuse.codeofconductP.bp6.text.en=Modify, adapt, sub-license, translate, sell, transfer, reverse engineer, decompile, or disassemble any portion of this website or the Site Materials
alyam.termsofuse.codeofconductP.bp6.text.ar=عدم تعديل، او تكييف، أو ترجمة، أو بيع، أو تحويل، أو تغيير هندسي، أو تجميع، أو فك تجميع ، أو أي تقسيم للموقع أو مواده.
alyam.termsofuse.codeofconductP.bp7.text.en="Frame" or "mirror" any part of this website without our prior written authorization
alyam.termsofuse.codeofconductP.bp7.text.ar=عدم وضع "اطار" أو "عكس" أي جزء من هذا الموقع بدون تفويض مكتوب بذلك منا.
alyam.termsofuse.codeofconductP.bp8.text.en=Tamper in any way with the software or functionality of this website, including, without limitation, transmitting or posting any software or other materials to this website that contains any viruses, time bombs, Trojan horses, worms, cancelbots or other computer programming routines that may damage, interfere with, intercept, or expropriate any system, data, or information
alyam.termsofuse.codeofconductP.bp8.text.ar=عدم التلاعب بأي طريقة كانت ببرمجيات أو وظائف الموقع، وتشمل ولكنها ليست مقصورة على اضافة أو نشر أي برمجيات، أو أي مواد أخرى لهذا الموقع تحتوى على فيروسات، أو برمجيات مغشوشة، أو اي من صيغ برامج الحاسوب الضارة، التي قد تؤدي بالأضرار بالأنظمة، أو البيانات ، أو المعلومات.
alyam.termsofuse.codeofconductP.bp9.text.en=Use any robot, spider, site search/retrieval application, or other manual or automatic device or process to retrieve, index, "data mine," or in any way reproduce or circumvent the navigational structure or presentation of this website or its contents;
alyam.termsofuse.codeofconductP.bp9.text.ar=عدم استخدام أي برامج بحث/ إعادة توجيه ، أو أي وسيلة أو عملية سواء كانت يدوية أو آلية بهدف إعادة التوجيه، أو الفهرسة، أو الأرشفة، أو إعادة الإخراج بأي من أشكال الغش للتلاعب في بنية الموقع أو طريقة عرضه أو محتوياته.
alyam.termsofuse.codeofconductP.bp10.text.en=Harvest or collect information about visitors to this website without their express consent.
alyam.termsofuse.codeofconductP.bp10.text.ar=عدم تجميع أي معلومات عن الزوار بدون الحصول على موافقة صريحة.
alyam.termsofuse.codeofconductP.bp11.text.en=Create a database by systematically downloading and storing all or any of the information on this website
alyam.termsofuse.codeofconductP.bp11.text.ar=عدم انشاء أي قاعدة بيانات بالتحميل الممنهج والحفظ لكل أو أي معلومات بالموقع.
alyam.termsofuse.codeofconductP.bp12.text.en=Make postings of a commercial nature. or
alyam.termsofuse.codeofconductP.bp12.text.ar=عدم وضع منشورات ذات طبيعة تجارية.
alyam.termsofuse.codeofconductP.bp13.text.en=Permit others, including those whose accounts were terminated, to access this website through your account, username or password.
alyam.termsofuse.codeofconductP.bp13.text.ar=عدم السماح للآخرين، بما فيهم الذين تم انهاء حساباتهم بالدخول للموقع من خلال حسابكم، أو اسم المستخدم، أو كلمة المرور.
alyam.termsofuse.codeofconductP2.text.en=In addition, while using this website and/or the Site Materials, you agree to comply with all applicable laws, rules, and regulations.
alyam.termsofuse.codeofconductP2.text.ar=بالإضافة إلى موافقتكم وخلال استخدامكم للموقع و/أو مواد الموقع بالالتزام بكل القوانين، والنظم، واللوائح السارية.
alyam.termsofuse.ReservationTitle.text.en=Making Reservations and Purchasing or Requesting Products or Services.
alyam.termsofuse.ReservationTitle.text.ar=الحجز
alyam.termsofuse.ReservationP.text.en=If you wish to make reservations or to purchase or request products or services described on this website, you may be asked by us (or, if you are purchasing or requesting the product or service through a co-branded area of this website, by the provider of such product or service) to supply certain data applicable to your reservation or purchase, including, without limitation, credit card information and other personally identifiable data about you. You understand that any such personally identifiable data will be treated by us in the manner described in the privacy policy accessible via a link provided at the bottom of the homepage of this website and, if Alyam branded provider is involved, such data will be treated by such provider in the manner set forth in that provider's privacy statement; you acknowledge that we are not responsible for the information collection or privacy practices of these providers or any other third parties. You agree that all data that you provide in making reservations or purchases or requesting services will be accurate, current, and complete. You agree to pay all charges incurred by you or any users of your account and credit card or other payment mechanism at the rate(s) or price(s) in effect when such charges are incurred. You will also be responsible for paying any applicable taxes relating to your purchases.
alyam.termsofuse.ReservationP.text.ar=وتشمل ولكنها ليست مقصورة على معلومات البطاقة الائتمانية ، او أي بيانات تعريفية متعلقة بكم ، وأنتم تستوعبون أن أي بيانات تعريفية شخصية سيتم التعامل معها من قبلنا بالطريقة التي تم وصفها في سياسة الخصوصية التي يمكن الوصول لها عبر الدخول إلى رابط موجود بالصفحة الرئيسية لهذا الموقع. وإذا كان مزود الخدمة بالعلامة التجارية اليَم مشترك، سوف تتم معاملة مثل هذه البيانات بالطريقة المذكورة اعلاه، ونحن غير مسئولين عن تجميع المعلومات، أو خصوصية المزودين أو أي أطراف أخرى. وعليكم الاقرار بان كل البيانات التي تقدمونها في القيام بالحجز هي بيانات دقيقة، ومحدثة، وكاملة . وتوافقون على سداد كل الرسوم المفروضة عليكم أو أي مستخدمين لحسابكم، أو بطاقتكم الائتمانية، أو أي آلية سداد أخرى بالمعدلات أو الأسعار السارية في وقت فرض هذه الرسوم. ونحتفظ بحق التغيير وبدون اخطار مسبق ويعتبر التحقق من البيانات المقدمة مطلوب قبل موافقتنا على الحجز او الشراء، وتكون الأسعار ومدى توفر المنتجات أو الخدمات مرهون بأحكام وشروط اضافية قد تفرض من قبلنا ، أو منسوبينا، او حاملي رخصتنا. ملخص سياساتنا المتعلقة بعروض أسعار الحجز وايجار السيارات يمكن الوصول إليها من خلال الموقع والتي من خلالها يمكن معرفة الأسعار والايجار عبرنا.
alyam.termsofuse.LinkTitle.text.en=Links
alyam.termsofuse.LinkTitle.text.ar=الروابط
alyam.termsofuse.LinkP1.text.en=This website may contain links to other Internet websites and online resources, Links on this website to other websites or resources shall not be construed as endorsement, control, review or approval of such other websites by us, You acknowledge and agree that we shall not be held responsible for the legality, accuracy, or inappropriate nature of any content, advertising, products, services, or information located on or through any other websites, nor for any loss or damages caused or alleged to have been caused by the use of or reliance on any such website or content.
alyam.termsofuse.LinkP1.text.ar=هذا الموقع يحتوى على روابط لبعض مواقع الانترنت الأخرى والمصادر المباشرة، والروابط الموجودة في الموقع للمواقع الأخرى والمصادر المباشرة ووجودها لا يعتبر ضمان من جانبنا على محتواها، وتقرون بأننا لا نتحمل أي مسئولية قانونية، أو عدم مناسبة أي من تلك المواقع أو محتواها، أو الاعلانات، أو المنتجات، أو الخدمات، أو المعلومات الموجودة فيها أو أي من المواقع الأخرى، وكذلك غير مسئولين عن الخسائر والأضرار التي تترتب على الاستخدام أو الوثوق في أي من تلك المواقع أو محتواها، وأيضاً طريقة معاملة البيانات عن طريق أي طرف ثالث قد تختلف من طريقة تعاملنا معها. وللتاكد من طريقة تعامل مشغلي المواقع الأخرى مع البيانات يجب مراجعة سياسة الخصوصية في تلك المواقع ، أو أحكام وشروط الاستخدام ، او التعاقد معهم في كيفية استخدام تلك البيانات.
