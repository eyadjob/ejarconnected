alyam.termsofuse.introductionP1.text.en=We offer this website, subject to the following terms and conditions ("Agreement"). Please read this Agreement carefully before using this website. By using this website, you accept the terms and conditions set forth in this Agreement. we make to this Agreement will be effective immediately upon posting. Please check this page periodically for changes to the Agreement; you will be able to determine if this Agreement has been changed since your previous visit by viewing the "Last Updated" information that appears at the top of this Agreement. Your use of this website following the posting of any changes constitutes acceptance of those changes.
alyam.termsofuse.introductionP1.text.ar=نعرض عليكم هذا الموقع الإلكتروني والذي يخضع لأحكام وشروط ("الاتفاقية") ، الرجاء قراءتها وفهمها جيدا قبل البدء في استخدام هذا الموقع . حيث أن البدء في استخدام الموقع يعني قبولكم لأحكام وشروط الاتفاقية. إذا كنتم لا توافقون على تلك الأحكام والشروط الرجاء عدم استخدام الموقع . كما نفيدكم بأنه ربما تتغير بعض هذه الأحكام والشروط من وقت لآخر حسب الأنظمة المتبعة.
alyam.termsofuse.introductionP2.text.en=As used in this Agreement, the terms "we" and "us" mean Alyam and the companies in which Alyam directly or indirectly owns a majority interest, commonly called "subsidiaries."  We operate vehicle and construction and industrial equipment rental businesses and, on a more limited scale, retail vehicle sales and claims administration businesses.  Our "licensees" are independent companies in the vehicle and construction and industrial equipment rental businesses, and sometimes in the retail vehicle sales business, that are licensed to operate such businesses using a trade name and trademarks and service marks owned by us, which often incorporate the "Alyam" mark.  Because the licensees are independent of us, they are not our subsidiaries and thus are not included in the terms "we" and "us."  Our "affiliates" at any time are the companies (other than us) that at the time control us or are under common control with us; the terms "we" and "us" do not include our affiliates.
alyam.termsofuse.introductionP2.text.ar=وعند استخدام هذه الاتفاقية فإن مصطلح " نحن" يعني اليَم ، وكل الشركات التي تملك فيها اليَم بطريقة مباشرة او غير مباشرة غالبية الأسهم وتسمى "الأفرع" ، نحن نشتغل في مجال تاجيرالسيارات ، والمنشآت، والمعدات الصناعية ، وبشكل محدود في مجال مبيعات تجزئة السيارات. و"حاملي رخصتنا " هم شركات مستقلة في مجال تأجير السيارات والمنشآت وفي بعض الأحيان في مجال مبيعات التجزئة في مجال بيع السيارات ، ومرخص لهم بالعمل في هذا المجال التجاري باستخدام الاسم التجاري والعلامات التجارية التي نملكها والتي من ضمنها علامة "اليَم". وحاملي رخصتنا باعتبارهم مستقلين عنا لذا لا يشملهم المصطلح "نحن" . و"منسوبينا " هم شركات أخرى (غيرنا) لذا لا يشملهم مصطلح "نحن".
