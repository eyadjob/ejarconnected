yelo.opl.opl-title-text.text.en=We’re always with you, get free insurance\nand save the maintenance hassle.
yelo.opl.opl-title-text.text.ar=استأجر سيارتك مع خدمة التأجير طويل الأجل ولا تشيل هم الصيانة والتأمين
yelo.opl.individualstext.text.en=You like to benefit from the rental of a new car and enjoy all the advantages of free maintenance service, insurance and breakdown service and would like to take advantage of these benefits over a long period? Individual long-term rental is made for you.
yelo.opl.individualstext.text.ar=إذا ودك تاخذ سيارة جديدة وتستمتع بكل مزايا خدمة الصيانة المجانية والتأمين وخدمة الدعم والمساعدة على مدار الساعة والكثير من المزايا الأخرى على فترات طويلة، فالاكيد ان خدمة التأجير طويل الأجل من يلو هو خيارك الأفضل.
yelo.opl.corporate.text.en=Corporate
yelo.opl.corporate.text.ar=خدمة التأجير طويل الأجل للشركات
yelo.opl.corporatetext.text.en=Would you like to facilitate your business by providing them with a vehicle that suits your practical needs and accomplish your work tasks? Corporate long-term rental is made for you .\nFor our fleet corporate rates and inquiries, please contact us at:\nEmail: cso@iyelo.com\nor call us: +966 590726794 .
yelo.opl.corporatetext.text.ar=إذا كنتم ترغبون بتسهيل أعمالكم من خلال تزويدهم بالسيارة التي تناسب احتياجاتكم العملية وإنجاز مهام عملكم ؟ خدمة التأجير طويل الأجل من يلـو هي خياركم الامثل.\nللأستفسارات ولمعرفة اسعارنا للتأجير طويل الأجل للشركات يرجى الأتصال بنا على\nالبريد الإلكتروني: cso@iyelo.com\nأو اتصل بنا: +966 590726794 .
yelo.opl.advantages.text.en=Full service & maintenance\nat your door, Full Warranty from\nmanufacturers, On-road\nassistance, Amyali\nmembership, Flexible and fixed\nmonthly payments, No\ndepreciation
yelo.opl.advantages.text.ar=خدمة الصيانة تأتيك اينما كنت, كفالة مصنعية شاملة, خدمة الدعم على الطريق\nوعلى مدار الساعة.,استمتع بمكافآت عضوية\nاميالي, دفعات شهرية\nمرنة وثابتة,توفير أكثر
yelo.opl.advantagestext.text.en=Rental Period:
yelo.opl.advantagestext.text.ar=بدأت شركة ناشئة؟ وقتك ثمين جدا! ليس لديك السيولة الكافية لشراء سيارات وتبحث عن خيار تنقل مرن، آمن وسريع لتستثمر وقتك في انجاز مهامك وتطوير اعمالك؟ خدمة التأجير طويل الأجل من يلـو هي خياركم الامثل.
yelo.opl.duration.text.en=You choose the duration that suits your needs: from 1 year to 3 years
yelo.opl.duration.text.ar=خيارات للفترة الزمنية للخدمة بما يتناسب واحتياجاتكم وتكون ما بين سنة واحدة الى ٣ سنوات أو أكثر .
yelo.opl.lower-monthly-payment.text.en=Lower monthly payment:
yelo.opl.lower-monthly-payment.text.ar=مميزات رائعة مع (خدمة التأجير طويل الأمد) :
yelo.opl.lower-monthly-paymenttext.text.en=You decide and know in advance the amount of your monthly rent. This amount is your fixed monthly payment, known in advance. This amount corresponds to your expected use of the car, so you pay the exact amount corresponding to your usage, which is cheaper than a purchase loan for the same car. Gain total peace of mind: you only need to enjoy driving, we take care of all the maintenance and repair of the car. Additional services included:
yelo.opl.lower-monthly-paymenttext.text.ar=خيارات للفترة الزمنية للخدمة بما يتناسب واحتياجاتكم وتكون ما بين سنة واحدة الى ٣ سنوات أو أكثر .
yelo.opl.advantages-various-fleet.text.en=Take advantage of our various fleet: Whether you want a low budget car like a changan L7, an intermediate luxury like a Mercedes C-Class, a robust SUV like a BMW X5, Yelo allows you to have the vehicle of your choice from 15 different Brands. Of course, you can choose the colour of your car.
yelo.opl.advantages-various-fleet.text.ar=استفد من أسطول سيارات يلـو المتنوع و الذي يوفر جميع الخيارات التي تناسب احتياجاتكم: سواء كنت تبحث سيارة بميزانية منخفضة مثل شنجان السيفن ، أو سيارة فاخرة متوسطة الحجم مثل مرسيدس (E class) ، أو سيارة دفع رباعي قوية مثل BMW X5 ،او سيارات ذات مواصفات خاصة , فإن يلـو توفر لكم اسطول من السيارات من 15 علامة تجارية مختلفة بفئاتها المختلفة.
yelo.opl.subject.text.en=Subject to availability,According to the terms of the insurance policy Yelo Company's general terms& conditions apply.
yelo.opl.subject.text.ar=يتم الاتفاق على عدد معيّن من الأميال المسموحة, تكون رسوم بدل الايجار ثابتة وتدفع عن طريق دفعة أوليّة مقدما، ثم يليها دُفعات شهرية طوال مدة العقد, تطبق الشروط والأحكام لشركة يلـو
