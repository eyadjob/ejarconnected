yelo.faq.incidentsandclaims.title.text.en=Incidents and claims
yelo.faq.incidentsandclaims.title.text.ar=الحوادث و المطالبات
yelo.faq.incidentsandclaims.procedure.q.text.en=I had an incident, what is the procedure to follow?
yelo.faq.incidentsandclaims.procedure.q.text.ar=حصل معي حادث ماهو الاجراء المتبع بعد ذلك؟
yelo.faq.incidentsandclaims.procedure.a.text.en=If, god forbid, should you get into an accident. The accident must be reported to najm or traffic, as for the car, it must be returned to the nearest branch in the accident area with the report from najm or traffic.
yelo.faq.incidentsandclaims.procedure.a.text.ar=حال حدوث حادث ( لاسمح الله ) لابد من مباشرة الحادث من نجم او المرور وتسليم التقرير والسيارة لأقرب فرع من منطقة للحادث.
yelo.faq.incidentsandclaims.accidentreportnajm.q.text.en=I had an accident and the car could not move, also I have a report from the najm/traffic?
yelo.faq.incidentsandclaims.accidentreportnajm.q.text.ar=حصل معي حادث والسيارة لا يمكن استخدامها ومعي تقرير من نجم ايش اسوي؟
yelo.faq.incidentsandclaims.accidentreportnajm.a.text.en=The vehicle needs to be transported to the nearest branch by a tow truck , As for the report to be also delivered with the car to the branch employee, and the bill will be issued after the accident procedures have been concluded.
yelo.faq.incidentsandclaims.accidentreportnajm.a.text.ar=يتم نقل السيارة لاقرب فرع على سطحة وتسليم التقرير لموظف الفرع  وتسليم أصل فاتورة السطحة ويتم صرفها بعد الانتهاء من إجراءات الحادث.
yelo.faq.incidentsandclaims.accident3rdparty.q.text.en=What are the procedures in case of an accident with a third party?
yelo.faq.incidentsandclaims.accident3rdparty.q.text.ar=ماهي إجراءات الحادث في حالة وجود طرف اخر؟
yelo.faq.incidentsandclaims.accident3rdparty.a.1.text.en=In the event of a zero error from the customer or if the customer adds a Yelo shield or Yelo shield plus , the customer does not bear any insurance policy, as long as there is a report from najm or traffic that includes the other party information.
yelo.faq.incidentsandclaims.accident3rdparty.a.1.text.ar=في حال نسبة الخطأ صفر على العميل او في حال إضافة العميل لدرع يلو او درع يلو بلس لا يتحمل العميل بوليصة التحمل  مع وجود التقرير موضح به بيانات الطرف الاخر.
yelo.faq.incidentsandclaims.accident3rdparty.a.2.text.en=If there is an error percentage on the customer and the customer didnt add any of the Yelo shields , the customer will pay insurance policy for the ages less than 26 AD, 7000 riyals, and in case of escape without information, and in case of accidents, drowning, and collision with a fixed object, 7000 riyals, and the policy of the car theft is 3500 riyals.
yelo.faq.incidentsandclaims.accident3rdparty.a.2.text.ar=في حال كان هناك نسبة خطأ على العميل ولم يضف العميل أيا من دروع يلو يتحمل العميل بوليصة للعمر اقل من 26 سنة ميلادي 7000 ريال و حال الهروب بدون معلومات و في حالة الحوادث و الغرق و الاصتدام بجسم ثابت 7000 ريال و قيمة تحمل السرقة 3500 ريال
yelo.faq.incidentsandclaims.accident3rdparty.a.3.text.en=Ages above 26 AD Accidents with another party and the error rate is less than 50% 2500 riyals and higher than 50% 3500 riyals and for drowning and collision with a fixed object, policy of the car theft, and escape without information 3500 riyals. As for the car , it must be returned with the report from najm or traffic to the nearest branch in the incident city.
yelo.faq.incidentsandclaims.accident3rdparty.a.3.text.ar=الاعمار اعلي من 26 سنة ميلادي الحوادث مع طرف اخر و نسبة الخطا اقل من 50% 2500 ريال و اعلي من 50% 3500 ريال و بالنسبة للغرق و الاصتدام بجسم ثابت و الهروب بدون معلومات و قيمة تحمل السرقة 3500 ريال.
yelo.faq.incidentsandclaims.accident3rdparty.a.4.text.en=In the absence of a report from najm or traffic, the customer shall be liable for all damages caused by the accident and this condition shall include all accidents.
yelo.faq.incidentsandclaims.accident3rdparty.a.4.text.ar=في حالة عدم وجود تقرير من نجم أو المرور يتحمل العميل التلفيات الناتجة عن الحادث كاملة وهذا الشرط شامل جميع حالات الحوادث.
yelo.faq.incidentsandclaims.procedureno3rdparty.q.text.en=What are the procedures for an accident if there is no other party?
yelo.faq.incidentsandclaims.procedureno3rdparty.q.text.ar=ماهي إجراءات الحادث في حالة عدم وجود طرف اخر؟
yelo.faq.incidentsandclaims.procedureno3rdparty.a.text.en=If there is a report from najm  or traffic and there is no other party registered to the report, the customer is liable for 3500 to 7000 Riyal insurance policy.
yelo.faq.incidentsandclaims.procedureno3rdparty.a.text.ar=في حالة وجود تقرير من نجم أو المرور ولا يوجد طرف اخر مسجل بالتقرير يتحمل العميل بوليصة الحادث من 3500 ريال الى 7000 ريال.
yelo.faq.incidentsandclaims.notcoveredinsurance.q.text.en=What conditions are not covered by insurance?
yelo.faq.incidentsandclaims.notcoveredinsurance.q.text.ar=ماهي الحالات التي لا يشملها التأمين؟
yelo.faq.incidentsandclaims.notcoveredinsurance.a.text.en= Failure to adhir the general traffic rules (bypass traffic lights, driving in reverse , driving under the influence), accident and non-lessee driver , the lessee driver intentionally damage the vehicle, or the customer
yelo.faq.incidentsandclaims.notcoveredinsurance.a.text.ar=عدم الالتزام بقواعد المرور العامة (قطع الإشارة – السير عكس الاتجاه – القيادة تحت تأثير مخدر) او وقوع حادث وشخص اخر غير المستأجر يقود السيارة  او تعمد المستأجر إلحاق الضرر بالسيارة، أو تأخر العميل عن موعد التسليم لأكثر من 24 ساعة مع وقوع حادث.
yelo.faq.incidentsandclaims.accidentoutofkingdom.q.text.en=What are the procedures of the accident if it happened outside the Kingdom?
yelo.faq.incidentsandclaims.accidentoutofkingdom.q.text.ar=يتوجب على المستأجر إحضار تقرير الشرطة / المرور بالحادث توضح نسبة الخطأ الخاصة بالعميل وتقدير معتمد للتلفيات من أقرب جهة معتمدة لمكان وقوع الحادث، ولا يشمل تلفيات الطرف الثاني.
yelo.faq.incidentsandclaims.accidentoutofkingdom.a.text.en=s fault rate and a certified assessment of the damage from the nearest authorized entity to the place of the incident, not including the second party damage.
yelo.faq.incidentsandclaims.accidentoutofkingdom.a.text.ar= يتوجب على المستأجر إحضار تقرير الشرطة / المرور بالحادث توضح نسبة الخطأ الخاصة بالعميل وتقدير معتمد للتلفيات من أقرب جهة معتمدة لمكان وقوع الحادث، ولا يشمل تلفيات الطرف الثاني
yelo.faq.incidentsandclaims.authorizationandinsurance.q.text.en=Does the international authorization cover accidents outside the Kingdom?
yelo.faq.incidentsandclaims.authorizationandinsurance.q.text.ar=هل التفويض الخارجي يشمل الحوادث خارج المملكة؟
yelo.faq.incidentsandclaims.authorizationandinsurance.a.text.en=s from Tamm website and Tamm is from the traffic.
yelo.faq.incidentsandclaims.authorizationandinsurance.a.text.ar=التفويض الخارجي هو السماح بالخروج من حدوود المملكة العربية السعودية، التأمين حالات الحوادث داخل المملكة.
yelo.faq.incidentsandclaims.returncarwithoutreport.q.text.en=Is it possible to return the accident car without a report and to make the report later and hand it over to the branch?
yelo.faq.incidentsandclaims.returncarwithoutreport.q.text.ar=هل يمكن تسليم سيارة  الحادث دون تقرير وعمل التقرير فيما بعد وتسليمه للفرع؟
yelo.faq.incidentsandclaims.returncarwithoutreport.a.text.en=In this case the customer will pay the full amount of the damages, and any report after returning the car and closing the contract will be invalid.
yelo.faq.incidentsandclaims.returncarwithoutreport.a.text.ar=في هذه الحالة يتحمل العميل تكلفة التلفيات كاملة و أي تقرير يأتي بعد تسليم العميل للسيارة و اغلاق العقد لا يؤخذ به.
yelo.faq.incidentsandclaims.expectedtimeframe.q.text.en=What is the expected timeframe to conclude the accident proceedures?
yelo.faq.incidentsandclaims.expectedtimeframe.q.text.ar=ماهي المدة المتوقعة للانتهاء من اجراءات الحادث ؟
yelo.faq.incidentsandclaims.expectedtimeframe.a.text.en=The proceedures take from 7 to 10 working days.
yelo.faq.incidentsandclaims.expectedtimeframe.a.text.ar=تستغرق اجراءات الحادث من 7 - 10 أيام عمل .
yelo.faq.additionalservices.title.text.en=Additional Services
yelo.faq.additionalservices.title.text.ar=الخدمات الاضافية
yelo.faq.additionalservices.diffyeloshields.q.text.en=What is the difference between the Yelo Shield and the Yelo Shield Plus?
yelo.faq.additionalservices.diffyeloshields.q.text.ar=ما الفرق بين درع يلو ودرع يلو بلس؟
yelo.faq.additionalservices.diffyeloshields.a.1.text.en=Both are extra insurance services, And the main role for them is to exempt the customer from the insurance policy in case of an accident between two parties, as long as there is a report from najm or traffic even if it
yelo.faq.additionalservices.diffyeloshields.a.1.text.ar=كلاهما خدمات تأمينية إضافية والدور الرئيسي لهما واحد وهو اعفاء العميل عن دفع بوليصة التحمل في حال وقوع حادث بين طرفين مع وجود تقرير من نجم او المرور حتى ولو كان الخطأ على العميل.
yelo.faq.additionalservices.diffyeloshields.a.2.text.en=The difference is the Yelo shield plus exempt the customer from small damages in addition to the exemption of the insurance policy, like the tire punctures, normal usage of the tires, dust in the frontal bumper and headlights, very minor windshield chips, and small scratches that don
yelo.faq.additionalservices.diffyeloshields.a.2.text.ar=والفرق بينهما ان درع يلو بلس بجانب ذلك يعفي العميل أيضا من تحمل بعض التلفيات البسيطة مثل بنشر الكفرات والاستهلاك الطبيعي لها .وغبرة الصدام والانوار الامامية ونقرات الزجاج الامامي البسيطة جدا والخدوش الصغيرة التي لا يتجاوز طولها  10 سم  وعرضها لا يتجاوز 2 سم.
yelo.faq.additionalservices.km/mileageservice.q.text.en=Do you have open kilometer/ open mileage service?
yelo.faq.additionalservices.km/mileageservice.q.text.ar=هل متاح لديكم خدمة الكيلو المفتوح؟
yelo.faq.additionalservices.km/mileageservice.a.text.en=Open kilometer/ Open mileage is available for a small amount added to the daily rental price and available for all car tiers except the luxury tier.
yelo.faq.additionalservices.km/mileageservice.a.text.ar=متوفر خدمة الكيلو المفتوح بتكلفة رمزية تضاف الى يومية السيارة ومتاحة الخدمة علي جميع الفئات ماعدا السيارات الفخمة.
yelo.faq.additionalservices.babyservices.q.text.en=Is the baby seats service available? And what are the conditions to benefit from the service in the kingdom?
yelo.faq.additionalservices.babyservices.q.text.ar=هل متوفر خدمة كرسي الأطفال وما شروط الإستفادة منها داخل المملكة؟
yelo.faq.additionalservices.babyservices.a.text.en=The service is free within the Kingdom and can be added during booking and the service is only available at airport branches and subject to availability.
yelo.faq.additionalservices.babyservices.a.text.ar=الخدمة مجانية داخل المملكة ويمكن اضافتها اثناء الحجز وللعلم الخدمة متوفرة في فروع المطارات فقط وحسب الاتاحة.
yelo.faq.additionalservices.dubaisalik.q.text.en=What is your Dubai Salik Service charge?
yelo.faq.additionalservices.dubaisalik.q.text.ar=ماهي رسوم خدمة سالك بدبي؟
yelo.faq.additionalservices.dubaisalik.a.text.en=Salik fees are (30) AED per day and allows to use unlimted salik.
yelo.faq.additionalservices.dubaisalik.a.text.ar=رسوم خدمة سالك (30) درهم لكل 24 ساعة وتتيح استخدام سالك لا محدود.
yelo.faq.additionalservices.externalauthorization.q.text.en=Is there International authorization service?
yelo.faq.additionalservices.externalauthorization.q.text.ar=هل متوفر خدمة التفويض الخارجي؟
yelo.faq.additionalservices.externalauthorization.a.text.en=International authorization is a service provided by Yelo which can be added during the rental from branches and its only available for the GCC countries only.
yelo.faq.additionalservices.externalauthorization.a.text.ar= التفويض الخارجي هي خدمة توفرها شركة يلو من خلال نظام تم ويمكن الإستفادة منها اثناء الإيجار من الفروع ومتاحة لدول مجلس التعاون الخليجي.
yelo.faq.additionalservices.conditionsforexternalauthorization.q.text.en=What are the conditions for obtaining international authorization for a citizen and resident?
yelo.faq.additionalservices.conditionsforexternalauthorization.q.text.ar=ماهي شروط الحصول على التفويض الخارجي للمواطن والمقيم؟
yelo.faq.additionalservices.conditionsforexternalauthorization.a.text.en=The use of the car outside the Kingdom is allowed only for the GCC countries after obtaining an authorization letter from the car rental branch for use outside the Kingdom and certified by the Chamber of Commerce.
yelo.faq.additionalservices.conditionsforexternalauthorization.a.text.ar=يسمح استخدام السيارة خارج المملكة فقط لدول مجلس التعاون الخليجي بعد الحصول على خطاب تفويض من فرع تأجير السيارات للاستخدام خارج المملكة ومصدق من الغرفة التجارية.
yelo.faq.additionalservices.costforexternalauthorization.q.text.en=What is the cost of an international authorization service?
yelo.faq.additionalservices.costforexternalauthorization.q.text.ar=ما هي تكلفة خدمة التفويض الدولي ؟
yelo.faq.additionalservices.costforexternalauthorization.a.text.en=80 SAR for Yelo Membership customers 64 SAR for Silver Membership 48 SAR for Gold and Platinum Membership.
yelo.faq.additionalservices.costforexternalauthorization.a.text.ar=80 ريال لعملاء العضوية الصفراء، 64 ريال للفضية، 48 ريال للذهبية والبلاتينية والتكلفة لمدة الرحلة كاملة المتفق عليها .

yelo.faq.additionalservices.businessdiscountexternalauthorization.q.text.en=Is the business discount applied to international authorization charges?
yelo.faq.additionalservices.businessdiscountexternalauthorization.q.text.ar=هل يتم الإستفادة من خصم العمل على رسوم التفويض الخارجي؟
yelo.faq.additionalservices.businessdiscountexternalauthorization.a.text.en=Silver , Gold and Platinum Memberships Discounts only.
yelo.faq.additionalservices.businessdiscountexternalauthorization.a.text.ar=يتم الإستفادة من خصم العضوية الفضية والذهبية و البلاتينية فقط.




alyam.faq.title.byxpath=//h1
alyam.faq.login-link.byxpath=//a[contains(@href , 'faq')]
alyam.faq.title.text.en=FAQs
alyam.faq.title.text.ar=الأسئلة الشائعة
alyam.faq.q1.byxpath=(//summary)[1]
alyam.faq.q1.text.en=Is there an international authorization?
alyam.faq.q1.text.ar=هل يوجد تفويض دولي ؟
alyam.faq.a1.byxpath=(//summary/following-sibling::p)[1]
alyam.faq.a1.text.en=Yes, there is an international authorization available for an additional fee determined at the branch.
alyam.faq.a1.text.ar=يوجد تفويض دولي برسوم إضافية يتم تحديدها بالفرع.
alyam.faq.q2.byxpath=(//summary)[2]
alyam.faq.q2.text.en=Is there Additional insurance?
alyam.faq.q2.text.ar=هل يوجد تامين شامل بدون نسبة تحمل ؟
alyam.faq.a2.byxpath=(//summary/following-sibling::p)[2]
alyam.faq.a2.text.en=Yes, Additional insurance is available for an extra daily fee, the amount will be determined according to the category of the car.
alyam.faq.a2.text.ar=يوجد تأمين شامل برسوم إضافية يتم دفعها يومياً وتحدد قيمتها بحسب فئة السيارة.
alyam.faq.q3.byxpath=(//summary)[3]
alyam.faq.q3.text.en=Where are the company’s branches located?
alyam.faq.q3.text.ar=أين تتواجد فروع الشركة ؟
alyam.faq.a3.byxpath=(//summary/following-sibling::p)[3]
alyam.faq.a3.text.en=Our branches are located in the central, eastern, southern, and western regions. You can refer to “Our branches” page to find our locations.
alyam.faq.a3.text.ar=بإمكانك الإطلاع على مواقع الفروع من خلال صفحة "فروعنا" حيث نتواجد بالمنطقة الوسطى والشرقية والجنوبية والغربية.
alyam.faq.q4.byxpath=(//summary)[4]
alyam.faq.q4.text.en=Are there branches at airports?
alyam.faq.q4.text.ar=هل يوجد فروع في المطارات ؟
alyam.faq.a4.byxpath=(//summary/following-sibling::p)[4]
alyam.faq.a4.text.en=Yes, there is a branch at King Khalid International Airport in Riyadh - Terminal 5.
alyam.faq.a4.text.ar=يوجد في مطار الملك خالد الدولي بالرياض - صالة 5.
alyam.faq.q5.byxpath=(//summary)[5]
alyam.faq.q5.text.en=What is the daily KM limit?
alyam.faq.q5.text.ar=كم عدد الكيلوات المسموحة يومياً ؟
alyam.faq.a5.byxpath=(//summary/following-sibling::p)[5]
alyam.faq.a5.text.en=The allowed KMs is 300 kilometers per day.
alyam.faq.a5.text.ar=الكيلوات المسموحة 300 كيلو في اليوم.
alyam.faq.q6.byxpath=(//summary)[6]
alyam.faq.q6.text.en=What is the allowed age for renting?
alyam.faq.q6.text.ar=ما هو العمر المسموح به للتأجير ؟
alyam.faq.a6.byxpath=(//summary/following-sibling::p)[6]
alyam.faq.a6.text.en=Minimum age is 21 years old, maximum age is 70 years old.
alyam.faq.a6.text.ar=أن لا يقل عن 21 سنة، ولا يزيد عن 70 عامًا.
alyam.faq.q7.byxpath=(//summary)[7]
alyam.faq.q7.text.en=Can the car be returned in another region? Are there additional fees for this?
alyam.faq.q7.text.ar=هل يمكن ارجاع السيارة في منطقة أخرى؟ وهل يترتب على ذلك رسوم إضافية ؟
alyam.faq.a7.byxpath=(//summary/following-sibling::p)[7]
alyam.faq.a7.text.en=It is possible to return the car at our branches in other regions for an additional shipping fee, determined by the region where the car is to be returned.
alyam.faq.a7.text.ar=من الممكن ارجاع السيارة في فروعنا بالمناطق الأخرى برسوم شحن إضافية يتم تحديدها بحسب المنطقة المراد التسليم بها.
alyam.faq.q8.byxpath=(//summary)[8]
alyam.faq.q8.text.en=Can the car be returned to another branch within the same city?
alyam.faq.q8.text.ar=هل يمكن ارجاع السيارة في فرع آخر في نفس المدينة ؟
alyam.faq.a8.byxpath=(//summary/following-sibling::p)[8]
alyam.faq.a8.text.en=It is possible to return the car to another branch within the same city without any fees.
alyam.faq.a8.text.ar=من الممكن ارجاع السيارة في فرع آخر داخل المدينة نفسها دون اى رسوم .
alyam.faq.q9.byxpath=(//summary)[9]
alyam.faq.q9.text.en=What should the customer do in case of an accident?
alyam.faq.q9.text.ar=ماهو الاجراء المطلوب من العميل في حال وقوع حادث ؟
alyam.faq.a9.byxpath=(//summary/following-sibling::p)[9]
alyam.faq.a9.text.en=The customer should contact Najm or the traffic police to obtain a report of the accident and bring it to the branch.
alyam.faq.a9.text.ar=يتم التواصل مع نجم او المرور من قبل العميل واخذ تقرير بالحادث ويتم تسليمة الى الفرع
alyam.faq.q10.byxpath=(//summary)[10]
alyam.faq.q10.text.en=Can the car be returned or exchanged for another one?
alyam.faq.q10.text.ar=هل يمكن ارجاع السيارة او استبدلها بسيارة أخرى ؟
alyam.faq.a10.byxpath=(//summary/following-sibling::p)[10]
alyam.faq.a10.text.en=If there is a issue with the rented car, the customer should go to the branch for inspection, and the car can be exchanged for another one in the same category.
alyam.faq.a10.text.ar=في حال تواجد مشكلة بالسيارة المستأجرة، تم التوجه الي الفرع لفحص السيارة والتأكد منها واستبدالها بسيارة أخرى من نفس الفئة




















#yelo.faq.whyYeloQs.text.en=I Paid yesterday and so far my name has not been removed from simah, why?
#yelo.faq.whyYeloQs.text.ar=لماذا يجب أن أختار يـلو بدلا من شركة تأجير أخرى؟
#yelo.faq.whyYeloAn.text.en=Unlike other car-rental companies, Yelo has branches at all regional & international airports within K.S.A, Yelo also has more than (70+) branches spreading all over K.S.A. only with us you have an opportunity to rent your favorite car among a wide variety of the latest vehicles in competitive rates. In addition Yelo has specialized maintenance centers in all regions equipped with the latest equipment maintenance and repair of all types of vehicles, and there is also a team of technicians on a high degree of experience and efficiency are willing to provide maintenance services around the clock.
#yelo.faq.whyYeloAn.text.ar=ليس كمثل بقية شركات تأجير السيارات الأخرى، يلو لديها فروع في جميع المطارات الإقليمية والدولية في المملكة العربية السعودية، يلو لديها أيضا أكثر من (70+) فرعا تنتشر في جميع أنحاء المملكة العربية السعودية ، فقط معنا لديك فرصة لاستئجار سيارتك المفضلة من بين تشكيلة واسعة من أحدث السيارات بأسعار تنافسية رائعة. وبالإضافة إلى ذلك يلو لديها مراكز للصيانة المتخصصة بجميع المناطق مزودة بأحدث معدات صيانة وإصلاح جميع أنواع المركبات، وهناك أيضا فريق عمل من الفنيين على درجة عالية من الخبرة والكفاءة على استعداد لتقديم خدمات الصيانة على مدار الساعة.
#yelo.faq.AccidentQs.text.en=. What to do if you made an accident in an Yelo vehicle?
#yelo.faq.AccidentQs.text.ar=ماذا تفعل إذا تعرضت لحادث سيارة مستأجرة من يـلو؟
#yelo.faq.AccidentAn.text.en=In the unlikely event of an accident, contact the police immediately then call Yelo renting location as soon as possible. An accident involving bodily injury must be reported to police department in the community in which it occurred. The driver is required to file any accident reports required to Yelo renting location.
#yelo.faq.AccidentAn.text.ar=في حالة وقوع حادث لاقدر الله ، اتصل بالشرطة على الفور ثم اتصل بفرع يلو الذي استاجرت منه السيارة في أقرب وقت ممكن. يجب إبلاغ الشرطة عن أي اصابات جسدية نتيجة للحادث في موقع حدوثها . كما أنه مطلوب تقديم كافة المستندات المطلوبة عن الحادث لفرع يـلو.
#yelo.faq.DamageQs.text.en=. What happens if the car is damaged during my rental period?
#yelo.faq.DamageQs.text.ar=ماذا يحدث في حالة حدوث تلف-ضرر بالسيارة خلال فترة التاجير؟
#yelo.faq.DamageAn.text.en=You are responsible for any damage during the lease period due to any cause including but not limited to collision, rollover, theft, tire damage, flood, fire, hail or other acts of Nature.
#yelo.faq.DamageAn.text.ar=أنت مسؤول عن أي تلف أو أضرار لحقت بالسيارة خلال فترة التأجير ناجمة عن أي سبب بما في ذلك على سبيل المثال لا الحصر الاصطدام، السرقة، تلف الإطارات، والفيضانات، والحرائق أو غيرها من أعمال الطبيعة.
#yelo.faq.NotResponAccidentQs.text.en=. What if I am not responsible for the accident or damage to the car?
#yelo.faq.NotResponAccidentQs.text.ar=ماذا لو أنني لست مسؤولا عن الحادث أو الأضرار التي لحقت السيارة؟
#yelo.faq.NotResponAccidentAn.first.text.en=If we have the information about the other party
#yelo.faq.NotResponAccidentAn.first.text.ar=إذا كان لدينا معلومات عن الطرف الآخر ، فإننا سنلاحقهم و نطالب شركة التأمين بالتعويض عن الأضرار التي لدينا. ومع ذلك مطالبتنا للطرف الآخر لا تعفيك من التزاماتك التعاقدية لدفع ثمن الأضرار إذا ثبت انك الطرف المخطئ في تقرير المرور.
#yelo.faq.NotResponAccidentAn.second.text.en=s, we will pursue them and/or their insurance company for our damages. However, our pursuit of the other party does not absolve you from your contractual obligation to pay for the damage if you
#yelo.faq.NotResponAccidentAn.second.text.ar=إذا كان لدينا معلومات عن الطرف الآخر ، فإننا سنلاحقهم و نطالب شركة التأمين بالتعويض عن الأضرار التي لدينا. ومع ذلك مطالبتنا للطرف الآخر لا تعفيك من التزاماتك التعاقدية لدفع ثمن الأضرار إذا ثبت انك الطرف المخطئ في تقرير المرور.
#yelo.faq.NotResponAccidentAn.third.text.en=re proven guilty in traffic report.
#yelo.faq.NotResponAccidentAn.third.text.ar=إذا كان لدينا معلومات عن الطرف الآخر ، فإننا سنلاحقهم و نطالب شركة التأمين بالتعويض عن الأضرار التي لدينا. ومع ذلك مطالبتنا للطرف الآخر لا تعفيك من التزاماتك التعاقدية لدفع ثمن الأضرار إذا ثبت انك الطرف المخطئ في تقرير المرور.
#yelo.faq.ForgetKeyQs.text.en=. I forget to return my rented car key, what can I do?
#yelo.faq.ForgetKeyQs.text.ar=نسيت ارجاع مفتاح السيارة المستأجرة بعد تسليمها ، ماذا يمكن أن أفعل ؟
#yelo.faq.ForgetKeyAn.text.en=Please contact the branch you rented the car from and then deliver the keys to the location where you dropped off your rental car.
#yelo.faq.ForgetKeyAn.text.ar=يرجى الاتصال بفرع التأجير ومن ثم تسليمه وارجاعه الى الفرع الذي قمت فيه بتسليم السيارة .
#yelo.faq.ForgetSomethingQs.text.en=. I forget something in my car I dropped off, what do I do?
#yelo.faq.ForgetSomethingQs.text.ar=نسيت شيئا في سيارتي التي قمت بتسليمها ، ماذا أفعل؟
#yelo.faq.ForgetSomethingAn.first.text.en=If you
#yelo.faq.ForgetSomethingAn.first.text.ar=إذا كنت قد تركت أغراضاً شخصية بالسيارة ، اتصل على الفور بفرع يـلو الذي سلمت فيه سيارتك بحيث يتمكن موظفينا من تفقد السيارة والبحث عن اغراضك وابلاغك على رقم الهاتف المسجل في عقد الإيجار. نوصي بشدة أن يتم الإبلاغ عن الأشياء المفقودة في أقرب وقت ممكن ونحن سوف نبذل قصارى جهدنا للعثور عليها.
#yelo.faq.ForgetSomethingAn.second.text.en=ve left a personal item behind, immediately call the same branch at which you dropped off your rental car so that their staff can check the vehicle personally. The phone number is listed on your rental agreement. We highly recommend that you report your lost item at your earliest convenience and We
#yelo.faq.ForgetSomethingAn.second.text.ar=إذا كنت قد تركت أغراضاً شخصية بالسيارة ، اتصل على الفور بفرع يـلو الذي سلمت فيه سيارتك بحيث يتمكن موظفينا من تفقد السيارة والبحث عن اغراضك وابلاغك على رقم الهاتف المسجل في عقد الإيجار. نوصي بشدة أن يتم الإبلاغ عن الأشياء المفقودة في أقرب وقت ممكن ونحن سوف نبذل قصارى جهدنا للعثور عليها.
#yelo.faq.ForgetSomethingAn.third.text.en=ll do our best to find it.
#yelo.faq.ForgetSomethingAn.third.text.ar=إذا كنت قد تركت أغراضاً شخصية بالسيارة ، اتصل على الفور بفرع يـلو الذي سلمت فيه سيارتك بحيث يتمكن موظفينا من تفقد السيارة والبحث عن اغراضك وابلاغك على رقم الهاتف المسجل في عقد الإيجار. نوصي بشدة أن يتم الإبلاغ عن الأشياء المفقودة في أقرب وقت ممكن ونحن سوف نبذل قصارى جهدنا للعثور عليها.
#yelo.faq.LostKeysQs.text.en=. I lost my car keys, am I liable?
#yelo.faq.LostKeysQs.text.ar=لقد فقدت مفاتيح سيارتي، هل انا مسئول ؟
#yelo.faq.LostKeysAn.text.en=Please call Yelo Customer Service at 920002909 for getting replacement keys. Yelo charges you the cost of replacing lost keys, the cost of delivering replacement keys and an administrative fee.
#yelo.faq.LostKeysAn.text.ar=يرجى الاتصال بخدمة العملاء يـلو على 920002909 للحصول على مفتاح احتياطي . عليك ان تقوم بسداد تكلفة استبدال المفتاح الضائع ورسوم ادارية.
#yelo.faq.LockoutQs.text.en=. I locked myself out of the vehicle, what do I do?
#yelo.faq.LockoutQs.text.ar=اقفلت السيارة والمفتاح بالداخل ، ماذا أفعل ؟
#yelo.faq.LockoutAn.text.en=Please call Yelo Customer Service at 920002909 for assistance. Yelo may charge you the cost of delivering the keys or towing the car to the nearest Yelo location and an administrative fee.
#yelo.faq.LockoutAn.text.ar=يرجى الاتصال بخدمة عملاء يـلو على 920002909 للحصول على المساعدة. عليك ان تقوم بسداد تكلفة تسليم مفتاح احتياطي أو سحب السيارة إلى أقرب موقع لشركة يلو ورسوم إدارية.
#yelo.faq.ParkingTicketsQs.text.en=. Am I responsible for parking tickets & traffic violations?
#yelo.faq.ParkingTicketsQs.text.ar=هل أنا مسؤول عن سداد تذاكر وقوف السيارات والمخالفات المرورية ؟
#yelo.faq.ParkingTicketsAn.text.en=Any parking tickets or traffic violations incurred by the renter remain the sole responsibility of the renter.
#yelo.faq.ParkingTicketsAn.text.ar=أي تذاكر وقوف السيارات أو المخالفات المرورية التي تسبب فيها المستأجر ، يعتبر مسئول عن سدادها.
#yelo.faq.VehicleOutQs.text.en=. Can I take the vehicle out of the KSA?
#yelo.faq.VehicleOutQs.text.ar=يمكن لي أن استخدم السيارة خارج المملكة العربية السعودية ؟
#yelo.faq.VehicleOutAn.text.en=Taking a car out of the KSA is allowed only to GCC countries after obtaining an authorization letter from the renting branch to use the car outside the Kingdom certified by the Chamber of Commerce.
#yelo.faq.VehicleOutAn.text.ar=يسمح استخدام السيارة خارج المملكة فقط لدول مجلس التعاون الخليجي بعد الحصول على خطاب تفويض من فرع تأجير السيارات للاستخدام خارج المملكة ومصدق من الغرفة التجارية.
#yelo.faq.CarOffRoadQs.text.en=. Can I take Yelo car off road?
#yelo.faq.CarOffRoadQs.text.ar=هل يمكنني استخدام السيارة على الطرق الوعرة؟
#yelo.faq.CarOffRoadAn.text.en=Yelo vehicles may be operated only on paved roads. Off-road driving is prohibited.
#yelo.faq.CarOffRoadAn.text.ar=يسمح استخدام سيارات يـلو فقط على الطرق الممهدة. يحظر القيادة على الطرق الوعرة..
#yelo.faq.SellCarsQs.text.en=. Does Yelo sell cars?
#yelo.faq.SellCarsQs.text.ar=هل يـلو تبيع السيارات ؟؟
#yelo.faq.SellCarsAn.text.en=Yelo sells Used Cars only. Our well-maintained fleet is continually being replaced with new cars - so we can offer a wide selection of used makes and models. Yelo has a used cars showroom with dedicated staff to make buying a used car easy and affordable!
#yelo.faq.SellCarsAn.text.ar=يـلو تقوم ببيع السيارات المستعملة فقط .حيث نقوم بتحديث الأسطول باستمرار وتحويل الموديلات الأقدم الى البيع لإستبدالها بالأحدث. يـلو لديها صالة عرض للسيارات المستعملة مع فريق عمل متميز لجعل شراء سيارة مستعملة أكثرسهولة ويسراً.
#yelo.faq.FeedbackQs.text.en=. How can I provide my comments or feedback?
#yelo.faq.FeedbackQs.text.ar=كيف يمكنني تقديم أي ملاحظات أو تعليقات؟
#yelo.faq.FeedbackAn.text.en=Yelo highly appreciates your comments and suggestions regarding our services. Please call a service representative at 920002909.
#yelo.faq.FeedbackAn.text.ar=يـلو تقدروتثمن تعليقاتكم واقتراحاتكم بشأن الخدمات التي نقدمها. لذا يرجي الاتصال بمندوبي خدمة العملاء على 920002909.
#yelo.faq.DropOffFeeQs.text.en=. Can I return a car to a different location, is there a drop-off fee?
#yelo.faq.DropOffFeeQs.text.ar=هل يمكنني تسليم السيارة إلى فرع آخر بخلاف الذي استأجرت منه, هل هناك رسوم اخرى ؟
#yelo.faq.DropOffFeeAn.text.en=Pick up a car at one location and return it to another, and a drop-off charge may apply on certain rates.
#yelo.faq.DropOffFeeAn.text.ar=نعم يمكنك تسليم السيارة الى أي فرع آخر تابع لشركة يـلو . ولكن هناك رسوم عند التسليم في فرع تابع لمنطقة أخرى.
#yelo.faq.ChangeTimeQs.text.en=. Can I change the time I return the vehicle after I picked it up?
#yelo.faq.ChangeTimeQs.text.ar=هل يمكنني تغيير وقت ارجاع السيارة بعد ان استلمتها؟
#yelo.faq.ChangeTimeAn.first.text.en=Cars are due back at the date/time specified on the rental agreement. If you need to extend your rental, you must call the rental Branch directly. The branch
#yelo.faq.ChangeTimeAn.first.text.ar=المفترض أن يتم ارجاع السيارة في الوقت المحدد في عقد الإيجار. إذا كنت بحاجة الى اطالة فترة التأجير الخاصة بك، يجب الإتصال بالفرع مباشرةً لتمديد الإيجار لك. رقم الفرع موجود على عقد الإيجار.
#yelo.faq.ChangeTimeAn.second.text.en=s phone number appears on your rental agreement.
#yelo.faq.ChangeTimeAn.second.text.ar=المفترض أن يتم ارجاع السيارة في الوقت المحدد في عقد الإيجار. إذا كنت بحاجة الى اطالة فترة التأجير الخاصة بك، يجب الإتصال بالفرع مباشرةً لتمديد الإيجار لك. رقم الفرع موجود على عقد الإيجار.
#yelo.faq.RentRequirementsQs.text.en=. What are the requirements should I meet to rent from Yelo?
#yelo.faq.RentRequirementsQs.text.ar=ما هي شروط ومتطلبات الإيجار من يـلو؟
#yelo.faq.RentRequirementsAn.text.en=Minimum age (21) years of age, A valid driving license is required and must be valid at the time of rental, and remain valid throughout the rental period, your ID Card for Saudis , your Iqama & letter from your sponsor for non-Saudis.
#yelo.faq.RentRequirementsAn.text.ar=الحد الأدنى للسن (21) سنة ، رخصة قيادة سارية المفعول ويجب أن تكون سارية خلال فترة الإيجار، ، بطاقة الهوية الخاصة بالسعوديين، والإقامة و خطاب من الكفيل لغير السعوديين .
#yelo.faq.EmergencyQs.text.en=. Does Yelo offer emergency road service?
#yelo.faq.EmergencyQs.text.ar=هل تقدم يـلو خدمة الطوارئ على الطريق ؟
#yelo.faq.EmergencyAn.text.en=Yelo provides 24-hour-a-day roadside assistance. Just call our Customer Service staff on free number (920002909) to take appropriate action.
#yelo.faq.EmergencyAn.text.ar=نعم تقدم يـلو خدمة المساعدة على الطرق على مدار الساعة ، فقط اتصل على خدمات العملاء على الرقم المجاني (920002909) لاتخاذ الإجراء المناسب.
#yelo.faq.CancelQs.text.en=. How can I cancel my reservation?
#yelo.faq.CancelQs.text.ar=كيف يمكنني إلغاء الحجز الخاص بي ؟
#yelo.faq.CancelAn.text.en=your reservations can be cancelled any time only before delivering the car . Just call our Customer Service staff on free number (920002909) to take appropriate action.
#yelo.faq.CancelAn.text.ar=يمكنك إلغاء الحجز الخاص بك في أي وقت فقط قبل استلام السيارة. فقط اتصل على خدمات العملاء على الرقم المجاني (920002909) لاتخاذ الإجراء المناسب.
#yelo.faq.MinimumTimeQs.text.en=. What’s the minimum length of time I can rent from Yelo?
#yelo.faq.MinimumTimeQs.text.ar=ماهو الحد الأدنى لفترة الإيجار من يـلو؟
#yelo.faq.MinimumTimeAn.text.en=The minimum length of time for rent from Yelo is (24) hrs.
#yelo.faq.MinimumTimeAn.text.ar=الحد الأدنى لفترة الإيجار هو (24) ساعة.
#yelo.faq.AddChargesQs.text.en=. Are there additional charges for returning the car late?
#yelo.faq.AddChargesQs.text.ar=هل هناك رسوم إضافية لإعادة السيارة في وقت متأخر عن المحدد بالعقد ؟
#yelo.faq.AddChargesAn.text.en=Depending on how late the car is returned, additional charges may apply. Yelo rentals are based on a 24-hour day, max (3) hrs grace period just for Al Yelo members , wherevre (1) hr for yellow membership holders, (2) hrs for silver membership holders and (3) hrs for gold membership holders. Beyond the grace period ( max 4 hrs ), an hourly rate will apply with the following equation: (daily rental value × number of delay hours / 24) × 2 = cost of delay hours
#yelo.faq.AddChargesAn.text.ar=نعم ، ولكن هناك فترة سماح بحد اقصى (3) ساعات تأخير لحاملي عضوية يـلو فقط ، بواقع (1) ساعة لأصحاب العضوية الصفراء وتصل الى (2) ساعاتين لأصحاب العضوية الفضية ، و(3) ساعات لأصحاب العضوية الذهبية – ومازاد عن ذلك (بحد اقصى 4 ساعات) يتم احتسابه وفق المعادلة التالية (( قيمة التأجير اليومي × عدد ساعات التأخير ) / 24 )) × 2 = تكلفة قيمة ساعات التأخير . . .



