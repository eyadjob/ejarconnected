alyam.privacyPolicy.useYourInformationTitle.text.en=2. How We Use Your Information
alyam.privacyPolicy.useYourInformationTitle.text.ar=2. استخدام معلوماتك
alyam.privacyPolicy.useYourInformationP.text.en=We use your personal information for various purposes:
alyam.privacyPolicy.useYourInformationP.text.ar=نستخدم معلوماتك الشخصية لأغراض مختلفة:
alyam.privacyPolicy.useYourInformationBp1.text.en=- Service Delivery: To process transactions, fulfill requests, and manage your account.
alyam.privacyPolicy.useYourInformationBp1.text.ar=- تقديم الخدمة: لمعالجة المعاملات، وتلبية الطلبات، وإدارة حسابك.
alyam.privacyPolicy.useYourInformationBp2.text.en=- Marketing and Updates: To keep you informed about our products, services, and special offers, as well as those from our trusted partners.
alyam.privacyPolicy.useYourInformationBp2.text.ar=- التسويق والتحديثات: لإبقائك على اطلاع دائم بمنتجاتنا وخدماتنا وعروضنا الخاصة، وكذلك تلك التي يقدمها شركاؤنا الموثوق بهم.
alyam.privacyPolicy.useYourInformationBp3.text.en=- Research and Improvement: To conduct surveys and gather insights to enhance our services, communications, and marketing efforts.
alyam.privacyPolicy.useYourInformationBp3.text.ar=- البحث والتحسين: لإجراء استطلاعات وجمع الآراء لتحسين خدماتنا واتصالاتنا وجهودنا التسويقية.
alyam.privacyPolicy.shareYourInformationTitle.text.en=3. Sharing Your Information
alyam.privacyPolicy.shareYourInformationTitle.text.ar=3. مشاركة معلوماتك
alyam.privacyPolicy.shareYourInformationP.text.en=Your personal information may be shared with Al Yam affiliates and trusted third parties to achieve the purposes stated in this policy. We do not sell or rent your data to non-affiliated entities. We may disclose your information:
alyam.privacyPolicy.shareYourInformationP.text.ar=قد تتم مشاركة معلوماتك الشخصية مع الشركات التابعة لشركة اليم وأطراف ثالثة موثوق بها لتحقيق الأغراض المنصوص عليها في هذه السياسة. نحن لا نبيع أو نؤجر بياناتك إلى كيانات غير تابعة. يجوز لنا الكشف عن معلوماتك:
alyam.privacyPolicy.shareYourInformation.Bp1.text.en=- With your consent to this Privacy Policy.
alyam.privacyPolicy.shareYourInformation.Bp1.text.ar=- بموافقتك على هذه السياسة.
alyam.privacyPolicy.shareYourInformation.Bp2.text.en=- To provide the services or products you request
alyam.privacyPolicy.shareYourInformation.Bp2.text.ar=- لتقديم الخدمات أو المنتجات التي تطلبها
alyam.privacyPolicy.shareYourInformation.Bp3.text.en=- When required for operational or contractual reasons
alyam.privacyPolicy.shareYourInformation.Bp3.text.ar=- عند الحاجة لأسباب تشغيلية أو تعاقدية
alyam.privacyPolicy.shareYourInformation.Bp4.text.en=- To comply with legal obligations
alyam.privacyPolicy.shareYourInformation.Bp4.text.ar=- للامتثال للالتزامات القانونية
alyam.privacyPolicy.shareYourInformation.Bp5.text.en=- In emergencies to protect individuals’ safety and well-being
alyam.privacyPolicy.shareYourInformation.Bp5.text.ar=- في حالات الطوارئ لحماية سلامة الأفراد.
alyam.privacyPolicy.yourConsentTitle.text.en=4. Your Consent
alyam.privacyPolicy.yourConsentTitle.text.ar=4. موافقتك
alyam.privacyPolicy.yourConsentP.text.en=We may reach out to you via various channels to inform you about new offerings, updates, or special promotions. You can opt-out of these communications by following the instructions provided or contacting us directly. We will seek your explicit consent for collecting sensitive information, in line with data protection laws.
alyam.privacyPolicy.yourConsentP.text.ar=قد نتواصل معك عبر قنوات مختلفة لإعلامك بالعروض الجديدة أو التحديثات أو العروض الترويجية الخاصة. يمكنك إلغاء الاشتراك في هذه الاتصالات باتباع التعليمات المقدمة أو الاتصال بنا مباشرة. سنسعى للحصول على موافقتك الصريحة لجمع المعلومات الحساسة، بما يتماشى مع قوانين حماية البيانات.
alyam.privacyPolicy.personalInformationTitle.text.en=5. Personal Information
alyam.privacyPolicy.personalInformationTitle.text.ar=5. تحديث المعلومات الشخصية
alyam.privacyPolicy.personalInformationP.text.en=To ensure your personal data is accurate, we encourage you to review and update it regularly. Note that some information may be retained for legal or technical reasons even after removal requests.
alyam.privacyPolicy.personalInformationP.text.ar=لضمان دقة بياناتك الشخصية، نشجعك على مراجعتها وتحديثها بانتظام. يرجى ملاحظة أنه قد يتم الاحتفاظ ببعض المعلومات لأسباب قانونية أو فنية حتى بعد طلبات الإزالة.
alyam.privacyPolicy.cookiesAndTrackingTitle.text.en=6. Cookies and Tracking
alyam.privacyPolicy.cookiesAndTrackingTitle.text.ar=6. ملفات تعريف الارتباط والتتبع
alyam.privacyPolicy.cookiesAndTrackingP.text.en=Our website and app use cookies and similar technologies to enhance your browsing experience. Cookies are small files stored on your device that help us remember your preferences and improve site functionality. You can manage cookies through your browser settings, but disabling them may affect certain features. We also use tracking technologies to collect aggregate data for analysis and improvement.
alyam.privacyPolicy.cookiesAndTrackingP.text.ar=يستخدم موقعنا الإلكتروني وتطبيقنا ملفات تعريف الارتباط وتقنيات مماثلة لتحسين تجربة التصفح الخاصة بك. ملفات تعريف الارتباط هي ملفات صغيرة يتم تخزينها على جهازك تساعدنا في تذكر تفضيلاتك وتحسين وظائف الموقع. يمكنك إدارة ملفات تعريف الارتباط من خلال إعدادات المتصفح، ولكن تعطيلها قد يؤثر على ميزات معينة. نستخدم أيضًا تقنيات التتبع لجمع البيانات المجمعة للتحليل والتحسين.
alyam.privacyPolicy.externalLinksTitle.text.en=7. External Links
alyam.privacyPolicy.externalLinksTitle.text.ar=7. الروابط الخارجية
alyam.privacyPolicy.externalLinksP.text.en=Our website may contain links to other sites for your convenience. We are not responsible for the privacy practices or content of these external sites. We recommend reviewing their privacy policies to understand how they handle your data.
alyam.privacyPolicy.externalLinksP.text.ar=قد يحتوي موقعنا الإلكتروني على روابط لمواقع أخرى لراحتك. نحن لسنا مسؤولين عن ممارسات الخصوصية أو محتوى هذه المواقع الخارجية. نوصي بمراجعة سياسات الخصوصية الخاصة بهم لفهم كيفية تعاملهم مع بياناتك.
alyam.privacyPolicy.childrenPrivacyTitle.text.en=8. Children’s Privacy
alyam.privacyPolicy.childrenPrivacyTitle.text.ar=8. خصوصية القاصرين
alyam.privacyPolicy.childrenPrivacyP.text.en=Al Yam does not knowingly collect information from individuals under the age of consent. If a minor provides us with personal data without parental consent, we encourage parents or guardians to contact us to remove the information and unsubscribe the minor from further communications.
alyam.privacyPolicy.childrenPrivacyP.text.ar=لا تجمع Al Yam بقصد معلومات عن الأفراد الذين تقل أعمارهم عن سن الرشد. إذا قدم لنا قاصر بيانات شخصية دون موافقة الوالدين، فنحن نحث الوالدين أو الأوصياء على التواصل معنا لإزالة المعلومات.
alyam.privacyPolicy.accuracyTitle.text.en=9. Accuracy
alyam.privacyPolicy.accuracyTitle.text.ar=9. الدقة
alyam.privacyPolicy.accuracyP.text.en=While we strive for accuracy, we do not guarantee the correctness of information on our website. We use pseudonyms and stock images to safeguard privacy. We are not liable for any inaccuracies or subsequent actions resulting from the information provided.
alyam.privacyPolicy.accuracyP.text.ar=على الرغم من أننا نسعى جاهدين لتحقيق الدقة، فإننا لا نضمن صحة المعلومات الموجودة على موقعنا الإلكتروني. نستخدم أسماء مستعارة وصور فوتوغرافية لحماية الخصوصية. لا نتحمل مسؤولية أي أخطاء أو إجراءات لاحقة ناتجة عن المعلومات المقدمة.
alyam.privacyPolicy.policyUpdatesTitle.text.en=10. Policy Updates
alyam.privacyPolicy.policyUpdatesTitle.text.ar=10. تحديثات السياسة
alyam.privacyPolicy.policyUpdatesP.text.en=We may revise this Privacy Policy from time to time to reflect changes in our practices or legal requirements. Updates will be posted on this page.
alyam.privacyPolicy.policyUpdatesP.text.ar=قد نقوم بمراجعة سياسة الخصوصية هذه من وقت لآخر لتعكس التغييرات في ممارساتنا أو المتطلبات القانونية. سيتم نشر التحديثات على هذه الصفحة.
alyam.privacyPolicy.contactInformationTitle.text.en=11. Contact Information
alyam.privacyPolicy.contactInformationTitle.text.ar=11. معلومات الاتصال
alyam.privacyPolicy.contactInformationP.text.en= For questions or concerns about this Privacy Policy or our data handling practices, please contact us at&nbsp;care@alyam.sa
alyam.privacyPolicy.contactInformationP.text.ar=للأسئلة أو الاستفسارات حول سياسة الخصوصية أو حول ممارساتنا في التعامل مع البيانات، يرجى الاتصال بنا على care@alyam.sa