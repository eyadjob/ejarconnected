yelo.privacyPolicy.title.text.en=Privacy Policy
yelo.privacyPolicy.title.text.ar=سياسة الخصوصية
yelo.privacyPolicy.firstParagraph.firstPart.text.en=We would like to inform you of the categories of personal data collected and processed by YELO, as well as the purposes for which these data are used. We also provide essential information regarding the protection of your data, particularly regarding your rights.
yelo.privacyPolicy.firstParagraph.secondPart.text.en=needs by using the information you entrust us with responsibly. Yelo is committed to respecting your privacy and adhering to the principles of applicable data protection and privacy laws throughout the world. We have provided this Privacy Statement as an explanation of the information we collect, how we use it, and how the use of this information can benefit your experience on our website and during your relationship with us. We wish to help you make informed decisions, so please take a moment to read the sections below.
yelo.privacyPolicy.firstParagraph.firstPart.text.ar=تهدف شركة يلو الى تقديم ما يفوق التوقعات في مجال المنتجات والخدمات التي نقوم بتقديمها لعملائنا الكرام وبشكل ثابت. ونكرس كل جهودنا في تقديم تجربة عبر الإنترنت تلبية لإحتياجاتكم بإستخدام المعلومات التي أوليتمونا ثقتكم في حمايتها والمحافظة عليها. وتلتزم شركة يلو باحترام خصوصيتكم وتطبيق كل قوانين ومبادئ حماية البيانات المطبقة في جميع أنحاء العالم. و نقدم لكم بيان سياسة الخصوصية هذا وهو بمثابة توضيح حول البيانات التي نقوم بجمعها، وكيفية استخدامها، وكيف أن طريقة استخدامنا لها من شأنها إثراء تجربتكم في استخدامكم لموقعنا الإلكتروني وأثناء علاقتكم معنا، ونهدف بهذا لمنحكم خلفية كاملة لتستندون عليها في اتخاذ قراركم، الرجاء منحنا دقائق من وقتكم الثمين للإطلاع على الفقرات أدناه.
yelo.privacyPolicy.firstParagraph.secondPart.text.ar=تهدف شركة يلو الى تقديم ما يفوق التوقعات في مجال المنتجات والخدمات التي نقوم بتقديمها لعملائنا الكرام وبشكل ثابت. ونكرس كل جهودنا في تقديم تجربة عبر الإنترنت تلبية لإحتياجاتكم بإستخدام المعلومات التي أوليتمونا ثقتكم في حمايتها والمحافظة عليها. وتلتزم شركة يلو باحترام خصوصيتكم وتطبيق كل قوانين ومبادئ حماية البيانات المطبقة في جميع أنحاء العالم. و نقدم لكم بيان سياسة الخصوصية هذا وهو بمثابة توضيح حول البيانات التي نقوم بجمعها، وكيفية استخدامها، وكيف أن طريقة استخدامنا لها من شأنها إثراء تجربتكم في استخدامكم لموقعنا الإلكتروني وأثناء علاقتكم معنا، ونهدف بهذا لمنحكم خلفية كاملة لتستندون عليها في اتخاذ قراركم، الرجاء منحنا دقائق من وقتكم الثمين للإطلاع على الفقرات أدناه.
yelo.privacyPolicy.infoTypes.text.en=Types of Information we Collect
yelo.privacyPolicy.infoTypes.text.ar=أنواع المعلومات التي نقوم بجمعها
yelo.privacyPolicy.infoTypesDescFirstPart.text.en=Yelo collects information about visitors to our website so that we can provide an experience that is responsive to our customers
yelo.privacyPolicy.infoTypesDescSecondPart.text.en=needs. Information may be collected as part of: (i) fulfilling information requests, (ii) registering for newsletter or programme membership, (iii) submitting a job application, or (iv) responding to communications from us (e.g., surveys or promotional offers or correspondence). We endeavour to collect information only with your knowledge and with your permission if necessary. The types of personally identifiable information that we collect may include your name, home, work and email addresses, telephone and fax numbers, and other information necessary to fulfil special requests. Yelo may also collect non-personally identifiable information about you, such as your use of our websites, communication preferences and responses to promotional offers and surveys.
yelo.privacyPolicy.infoTypesDescFirstPart.text.ar=تقوم شركة يلو بجمع معلومات عن الزائرين للموقع لتقديم ما يلبي احتياجات العملاء، وتقوم بجمع هذه المعلومات بعلمكم وموافقتكم ، وهذه المعلومات تشمل، الاسم، والدولة، وعنوان العمل، وعنوان البريد الإلكتروني، وأرقام الهاتف والفاكس، وأي معلومات أخرى ضرورية.
yelo.privacyPolicy.infoTypesDescSecondPart.text.ar=تقوم شركة يلو بجمع معلومات عن الزائرين للموقع لتقديم ما يلبي احتياجات العملاء، وتقوم بجمع هذه المعلومات بعلمكم وموافقتكم ، وهذه المعلومات تشمل، الاسم، والدولة، وعنوان العمل، وعنوان البريد الإلكتروني، وأرقام الهاتف والفاكس، وأي معلومات أخرى ضرورية.
yelo.privacyPolicy.collectionProcessingPurpose.text.en=Purpose for Collection, Processing, and Disclosure
yelo.privacyPolicy.collectionProcessingPurpose.text.ar=أغراض جمع، ومعالجة، وكشف المعلومات
yelo.privacyPolicy.collectionUse.text.en=Collection and Use
yelo.privacyPolicy.collectionUse.text.ar=الجمع والاستخدام
yelo.privacyPolicy.collectionUseDesc.text.en=Yelo is fully committed to providing you with information about the collection and use of personally identifiable information (PII) furnished by, or collected from, visitors while using our website, products and services. It is our practice not to ask you for information unless we need it or intend to use it. Some of the primary purposes for collecting your PII are as follows:
yelo.privacyPolicy.collectionUseDesc.text.ar=شركة يلو ملتزمة بتوضيح كيفية جمع واستخدام معلومات التعريف الشخصية من الزائرين أثناء استخدامهم للموقع، وديدننا في هذا أن لا نقوم بطلب معلومات ما لم نكن في حاجة ماسة لها، أو استخدامها، وبعض الاستخدامات الأولية لمعلومات التعريف الشخصية هي :
yelo.privacyPolicy.collectionFirstPurpose.text.en=Providing services such as processing a transaction (e.g. fulfilling a request for information)
yelo.privacyPolicy.collectionFirstPurpose.text.ar=تقديم خدمة مثل الرد على مقتراحاتكم ومعاملاتكم.
yelo.privacyPolicy.collectionSecondPurpose.text.en=Marketing and communicating with you in relation to the products and services offered by Yelo, our strategic marketing partners, and other trusted third parties
yelo.privacyPolicy.collectionSecondPurpose.text.ar=التسويق، والتواصل معكم فيما يتعلق بعروض الخدمات التي تقدمها يلو، أو شركاء شركة يلو ، أو أي طرف ثالث موثوق به.
yelo.privacyPolicy.collectionUseFooter.text.en=You will always be offered the choice not to submit your PII or to decide what communications you would like to receive from us. However, doing so may cause certain transactions to be affected.
yelo.privacyPolicy.collectionUseFooter.text.ar=ولكم الخيار دوماً في تقديم معلوماتكم التعريفية الشخصية من عدمه أو تحديد نوع الاتصالات التي ترغبون في استقبالها منا، على الرغم من أن هذا بدون شك قد يؤثر على تقديم الخدمات والسرعة فيما بيننا.
yelo.privacyPolicy.Processing.text.en=Processing and Disclosure
yelo.privacyPolicy.Processing.text.ar=معالجة وكشف المعلومات
yelo.privacyPolicy.ProcessingDesc.text.en=In most cases, the information you provide is added to a local or global database. In the course of processing your information, it may be necessary to transfer your PII to Yelo affiliates and / or third party service providers located in the United Kingdom and throughout the world for the purposes outlined within this Privacy Statement. As a general practice, Yelo does not sell, rent or give physical possession of your PII to unaffiliated third parties outside the Yelo system. Situations in which Yelo may disclose your information to others include:
yelo.privacyPolicy.ProcessingDesc.text.ar=في أغلب الحالات تتم إضافة المعلومات التى المقدمة من جانبكم إلى قاعدة معلومات محلية أو عالمية، وفي إطار معالجة معلوماتكم قد يكون من الضروري تحويلها إلى منسوبي شركة يلو و/أو مزودي خدمة آخرون في المملكة العربية السعودية أو في أي مكان في العالم وذلك بغرض وضع الخطوط العريضة لسياسة الخصوصية المستخدمة في هذا البيان. وفي مجمل التجربة فأن شركة يلو لا تقوم بييع، أو ايجار، أو منح تملك مادي لمعلومات التعريف الشخصية الخاصة بكم لأي أطراف أخرى خارج منظومة شركة يلو، والحالات التي تقوم فيها شركة يلو بالكشف عن المعلومات للآخرين تشمل:
yelo.privacyPolicy.disclosureFirstCase.text.en=When we have received your consent to do so
yelo.privacyPolicy.disclosureFirstCase.text.ar=في حالة استلام موافقتكم على كشف المعلومات.
yelo.privacyPolicy.disclosureSecondCase.text.en=In situations where sharing or disclosing your information is required in order to offer you products or services you desire (e.g., a job application)
yelo.privacyPolicy.disclosureSecondCase.text.ar=في الحالات التي يكون فيها كشف المعلومات ضرورياً للجهات الرسمية او شركات التأمين.
yelo.privacyPolicy.disclosureThirdCase.text.en=When companies or services providers that perform business activities on behalf of Yelo require such information (e.g. customer support services, market research administration or database management services)
yelo.privacyPolicy.disclosureThirdCase.text.ar=عندما تكون هذه المعلومات مطلوبة من قبل الشركات التي تقوم بتقديم الخدمات بالنيابة عن شركة يلو ( مثل خدمات دعم العميل، أو إدارة بحوث التسويق، أو إدارة قاعدة البيانات).
yelo.privacyPolicy.disclosureFourthCase.text.en=When access to your PII is necessary to facilitate business operations or meet contractual obligations
yelo.privacyPolicy.disclosureFourthCase.text.ar=عندما يكون الوصول إلى المعلومات ضروري لتسهيل العمليات التجارية أو الوفاء بالإلتزامات التعاقدية.
yelo.privacyPolicy.disclosureFifthCase.text.en=To comply with legal or regulatory requirements or obligations in accordance with applicable law or court order
yelo.privacyPolicy.disclosureFifthCase.text.ar=للتقيد والالتزام بالمتطلبات القانونية والنظامية لقانون سائد أو امر محكمة.
yelo.privacyPolicy.disclosureSixthCase.text.en=In case of emergency such as to safeguard the life, health, or property of an individual
yelo.privacyPolicy.disclosureSixthCase.text.ar=في حالة الطواري مثل حماية، حياة، او صحة، أو ممتلكات فرد.
yelo.privacyPolicy.consent.text.en=Consent
yelo.privacyPolicy.consent.text.ar=الموافقة
yelo.privacyPolicy.consentFirstP.text.en=As part of our commitment to keep you informed, we may mail, email, telephone or contact you by other means to notify you of new Yelo products and services or upcoming Yelo special offers, events, enhancements or other relevant information that may be of interest to you. You may also receive mailings or other communications from carefully selected third parties. We always offer you the option to decline any or all of these communications by following the directions included in our emails or other communications or by contacting Yelo directly.
yelo.privacyPolicy.consentFirstP.text.ar=كجزء من إلتزامنا بالشفافية معكم، قد نقوم بالاتصال بكم عبر البريد العادي، أو البريد الإلكتروني، أو الهاتف أو أي وسيلة اتصال أخرى لإطلاعكم على جديد منتجات شركة يلو، وخدماتها، أو باي عروض خاصة جديدة، أو أحداث، او أي معلومات أخرى قد تكون من مصلحتكم. وقد تتلقون رسائل بريدية من أطراف أخرى مختارين بعناية، ونمنحكم الحق في رفض أي من أو كل تلك المراسلات وذلك بإتباع التوجيهات في رسائلنا البريدية أو بالاتصال مباشرة بشركة يلو.
yelo.privacyPolicy.consentSecondP.text.en=We would like to keep all customers informed and equally able to take advantage of the benefits offered by Yelo and its strategic marketing partners. However, if you reside outside of the United Arab Emirates, certain data privacy regulations may require us to obtain your permission before we send you information that you have not requested from us. In some cases your permission will be implied from the nature of the service requested or transaction undertaken. For example, Yelo may collect and use personally identifiable information that you volunteer or behavioural data or information collected in the aggregate. In addition, your permission will be deemed given for communications from us that are necessary to fulfil transactions and services that you request.
yelo.privacyPolicy.consentSecondP.text.ar=ونود أن نبقي كل العملاء الكرام على اطلاع لتكون الفرصة متساوية للإستفادة من عروض شركة يلو وشركائها.
yelo.privacyPolicy.consentThirdP.text.en=In certain circumstances, we will seek your express permission when we collect information that is regarded under certain data privacy regulations to be sensitive in nature (e.g., information revealing racial or ethnic origin or health conditions).
yelo.privacyPolicy.consentThirdP.text.ar=
yelo.privacyPolicy.dataTransfer.text.en=Data Transfers Across International Borders
yelo.privacyPolicy.dataTransfer.text.ar=الوصول لمعلومات التعريف الشخصية
yelo.privacyPolicy.dataTransferDesc.text.en=Yelo endeavours to provide you a consistent level of customer service. To achieve this goal, we have established a global network comprised of properties, offices, data centres, trusted marketing partners, service providers, customer contact centres and trained colleagues around the world. The nature of our business and operations may require us to transfer your information, including personally identifiable information (PII), to other group companies, properties, centres of operations, data centres, or service providers that may be located in countries outside of your own. Although the data protection and other laws of these various countries may not be as comprehensive as those in your own country, Yelo will take appropriate steps to ensure that your PII is protected and handled as described in this Privacy Statement.
yelo.privacyPolicy.dataTransferDesc.text.ar=
yelo.privacyPolicy.personallyInfo.text.en=Access to Personally Identifiable Information
yelo.privacyPolicy.personallyInfo.text.ar=الوصول لمعلومات التعريف الشخصية
yelo.privacyPolicy.personallyInfoDesc.text.en=To ensure that your personally identifiable information (PII) is accurate and up to date, we encourage you to regularly review and update your information as appropriate (e.g. in the event your home or email address changes or you wish to add an additional method for us to communicate with you). If you are registered under our recruitment portal, you can review and update your individual profile online. Please note that in an effort to prevent the unauthorised disclosure of your PII, you may be asked to provide proof of identity (or other authentication materials) together with the completed access request form. Access to PII cannot be provided by telephone. Occasionally, information that you request to be removed will be retained in certain files for a period of time in order to properly resolve disputes or to troubleshoot problems. In addition, some types of information may be stored indefinitely on "back up" systems or within log files due to technical constraints or financial or legal requirements. Therefore, you should not always expect that all of your PII will be completely removed from our databases in response to your request.
yelo.privacyPolicy.personallyInfoDesc.text.ar=ولضمان أن تكون معلومات التعريف الشخصية محمية ومحدثة، نحثكم على مراجعتها وتحديثها بإنتظام (مثلاً في حالة تغيير العنوان، أو البريد الإلكتروني أو رغبتم في إضافة وسيلة اتصال أخرى في التواصل معكم). إذا سجلتم تحت بوابة استخدامنا يمكنكم المراجعة والتعديل عبر الإنترنت مباشرة. قد تطالبون بإثبات هويتكم (أو أي مواد مصادقة أخرى) مع نموذج طلب الوصول الكامل. ولا يمكن الوصول لمعلومات التعريف الشخصية عبر الهاتف. وفي حالة طلبكم بإزالة بعض المعلومات سيتم الاحتفاظ بهذه المعلومات في ملفات معينة لفترة من الزمن حتى حل النزاعات وتصويب الخطأ ، إلا أن بعض أنواع المعلومات سيتم تخزينها لفترة غير محددة في أنظمة "الحفظ" أو ملفات الدخول نسبة للمشاكل التقنية، أو المادية، أو المتطلبات القانونية، لذا لا تتوقعوا منا دائماً أن نقوم بإزالة معلومات التعريف الشخصية من قاعدةالبيانات استجابة لطلبكم.
yelo.privacyPolicy.onlineTechs.text.en=On-line Technologies
yelo.privacyPolicy.onlineTechs.text.ar=التقنيات المباشرة عبر الإنترنت
yelo.privacyPolicy.onlineTechsFirstPFIrstPart.text.en=yelo.privacyPolicy.onlineTechsFirstP.text.en=Yelo may use cookies, invisible pixels and web beacons to obtain information about you while visiting our website. A cookie is a very small text file that is sent to your browser from a web server and stored on your computer
yelo.privacyPolicy.onlineTechsFirstPSecondPart.text.en=hard drive. It assigns the computer with a unique identifier, which in turn, becomes your identification card whenever you return to this website. Cookies are designed to save you time because they help us to provide you with a customised experience without you having to remind us of your preferences each time you return to our web pages. Yelo cookies are not designed to damage your files, nor can they read information from other files on your computer hard drive. Cookies can also help us provide you with a personalised on-line experience in the following ways:
yelo.privacyPolicy.onlineTechsFirstPFIrstPart.text.ar=قد تقوم شركة يلـو بإستخدام سجلات تتبع، ونقاط شاشة (وحدات بيكسل) غير مرئية، وفنارات دالة للحصول على معلومات عنكم أثناء زيارتكم للموقع. وسجل التتبع هو ملف نصي صغير يرسل لمتصفحكم من السيرفر ويتم تخزينه في محرك الأقراص الصلبة في جهاز الكومبيوتر، ويعطي الكمبيوتر ميزة فريدة في انه سيكون بطاقة تعريف في حالة الرجوع للموقع الإلكتروني. وسجلات التتبع مصممة بحيث توفر وقتكم لأنها تمدكم بالتجربة المخصصة بدون تذكيرنا بأولياتكم في مرة في رجوعكم لصفحاتنا على الإنترنت، وسجلات تتبع شركة يلـو غير مصممة على الحاق الضرر على ملفاتكم أو قراءة ملفات أخرى موجودة في محرك الأقراص الصلبة في الكومبيوتر. وسجلات التتبع تمكننا ايضاً في مدكم بتجربة شخصية مباشرة عبر الإنترنت بالطرق الآتية :
yelo.privacyPolicy.onlineTechsFirstPSecondPart.text.ar=قد تقوم شركة يلـو بإستخدام سجلات تتبع، ونقاط شاشة (وحدات بيكسل) غير مرئية، وفنارات دالة للحصول على معلومات عنكم أثناء زيارتكم للموقع. وسجل التتبع هو ملف نصي صغير يرسل لمتصفحكم من السيرفر ويتم تخزينه في محرك الأقراص الصلبة في جهاز الكومبيوتر، ويعطي الكمبيوتر ميزة فريدة في انه سيكون بطاقة تعريف في حالة الرجوع للموقع الإلكتروني. وسجلات التتبع مصممة بحيث توفر وقتكم لأنها تمدكم بالتجربة المخصصة بدون تذكيرنا بأولياتكم في مرة في رجوعكم لصفحاتنا على الإنترنت، وسجلات تتبع شركة يلـو غير مصممة على الحاق الضرر على ملفاتكم أو قراءة ملفات أخرى موجودة في محرك الأقراص الصلبة في الكومبيوتر. وسجلات التتبع تمكننا ايضاً في مدكم بتجربة شخصية مباشرة عبر الإنترنت بالطرق الآتية :
yelo.privacyPolicy.onlineFirstWay.text.en=They remember your user name and password for future visits so log in is easier and faster
yelo.privacyPolicy.onlineFirstWay.text.ar=تقوم بحفظ اسم المستخدم وكلمة المرور للدخول مستقبلاً بيسر وسهولة.
yelo.privacyPolicy.onlineSecondWay.text.en=They ensure you are provided with the appropriate frames and content
yelo.privacyPolicy.onlineSecondWay.text.ar=تؤكد وصول الإطارات والمحتوى المناسب لكم.
yelo.privacyPolicy.onlineThirdWay.text.en=They ensure you obtain all requested information
yelo.privacyPolicy.onlineThirdWay.text.ar=تؤكد أنكم قمتم بالحصول على المعلومات المطلوبة.
yelo.privacyPolicy.onlineFourthWay.text.en=They help us deliver communications that are relevant and responsive to your interests and location
yelo.privacyPolicy.onlineFourthWay.text.ar=تساعدنا في تسليم المراسلات المتعلقة بمصالحكم وموقعكم.
yelo.privacyPolicy.onlineLastPFirstPart.text.en=Yelo cookies are limited to this website only and are not designed to follow you when travelling on the Internet after leaving this website. We track the usage of our website in order to better meet your needs and to help make it easier for you to find information in the future. Please note that in addition various third parties may also place cookies on your computer
yelo.privacyPolicy.onlineLastPSecondPart.text.en=hard drive. Yelo is not responsible for the presence or absence of third party cookies or for the technological capabilities or practices employed by third parties in connection with third party cookies. If you would prefer not to have the benefits of cookies, your Internet browser can be adjusted to treat cookies in different ways. Depending upon the type of browser you are using, you may be able to configure your browser so that: (i) you are prompted to accept or reject cookies on an individual basis or (ii) you may be able to prevent your browser from accepting any cookies at all. You should refer to the supplier or manufacturer of your web browser for specific details about cookie security. However, you should also understand that rejecting cookies might affect your ability to perform certain transactions on this website and our ability to recognise your browser from one visit to the next. Yelo also uses invisible pixels, sometimes called web beacons, to count how many people visit certain web pages. Information collected from invisible pixels is used and reported in the aggregate and does not contain personally identifiable information. Yelo may use this information to improve marketing programmes and content.
yelo.privacyPolicy.onlineLastPFirstPart.text.ar=سجلات تتبع شركة يلو محدودة بإستخدامكم هذا الموقع وغير مصممة لتعقبكم في تصفحكم لمواقع الإنترنت الأخرى بعد تسجيل الخروج من هذا الموقع . ونحن نتعقب استخدام موقعنا من تلبية احتياجاتكم وتسهيل عملية العثور على المعلومات في المستقبل. والرجاء ملاحظة الأطراف الأخرى قد تضع سجلات تتبع أيضاً في محرك الاقراص الصلبة لديكم، وعليه شركة يلو غير مسئولة عن ظهور أو غياب سجلات تتبع لأي طرف ثالث، أو عن أي امكانيات تقنية أو ممارسات تتعلق بسجلات أطراف أخرى.
yelo.privacyPolicy.onlineLastPSecondPart.text.ar=وتستخدم شركة يلو أيضاً نقاط شاشة (وحدات بيكسل) غير مرئية، و تعرف أحياناً بالفنارات الدالة ، وذلك لمعرفة عدد الأشخاص الذين قاموا بزيارة صفحات . تستخدم هذه المعلومات كتقارير ولا تحتوى على أي معلومات تعريف شخصية وتستخدم شركة يلو هذه المعلومات لتطوير برامج التسويق ومحتوى الموقع.
yelo.privacyPolicy.otherWebsites.text.en=Links to Other Web Sites
yelo.privacyPolicy.otherWebsites.text.ar=وضع الروابط لمواقع أخرى
yelo.privacyPolicy.otherWebsitesDesc.text.en=In order to anticipate your needs, Yelo provides links to other websites for your convenience and information. Yelo is not responsible or liable for any content presented by or contained on any independent website, including, but not limited to, any advertising claims or marketing practices. Please note that while Yelo will protect your information on this website, we cannot control and will not be responsible for the privacy policies of third party websites, including websites owned or controlled by independent franchisees, third party owners, or websites not controlled or authorised by Yelo. Third party web sites that are accessed through links on our website have separate privacy and data collection practices and security measures. We have no responsibility or liability for the practices, policies and security measures implemented by third parties on their websites and recommend that you review the privacy statements and policies of linked websites to understand how those websites collect, use and store information.
yelo.privacyPolicy.otherWebsitesDesc.text.ar=والمواقع الأخرى لأي طرف ثالث يتم الوصول إليها عبر موقعنا لديها سياسة خصوصية ، ووسائل جمع، وتدابير حماية منفصلة. وعليه فإن شركة يلو غير مسئولة ولا تتحمل مسئولية أي ممارسات، وسياسات، وتدابير أمنية تطبقها الأطراف الأخرى على مواقعهم وأنتم مطالبون بمراجعة بيانات الخصوصية والسياسات للمواقع المتصلة لمعرفة الكيفية التي تقوم بها تلك المواقع في جمع واستخدام وتخزين المعلومات.
yelo.privacyPolicy.minors.text.en=Minors
yelo.privacyPolicy.minors.text.ar=المستخدمين القاصرين
yelo.privacyPolicy.minorsDesc.text.en=Yelo does not seek to obtain nor does it wish to receive personally identifiable information directly from minors; however, we cannot always determine the age of persons who accesses and uses our website. If a minor (as defined by applicable law) provides us with his/her data without parental or guardian consent, we encourage the parent or guardian to contact us to have this information removed and to unsubscribe the minor from future Yelo marketing communications.
yelo.privacyPolicy.minorsDesc.text.ar=لاترغب شركة يلو أو تبحث في استلام معلومات تعريف شخصية من الأشخاص القاصرين مباشرة، ولا تستطيع على تحديد أعمار الاشخاص الذين يقومون بالدخول واستخدام الموقع ، فإذا مدنا القاصر (كما يعرفه القانون الساري) ببياناته/ بياناتها بدون موافقة والديه أو الوصي، نحن نشجع الوالدين أو الوصي على الاتصال بنا لإزالة وعدم إدراج القاصرين في اتصالات يلو التسويقية.
yelo.privacyPolicy.accuracy.text.en=Accuracy and Privacy
yelo.privacyPolicy.accuracy.text.ar=الدقة والخصوصية
yelo.privacyPolicy.accuracyDesc.text.en=While every attempt is made to ensure that the information presented in all items on this web site is both accurate and useful, Yelo does not make any warranty regarding the content or accuracy of the materials accessible through this website or its host server. In order to protect the identities and privacy of our employees, pseudonyms and stock imagery has been used throughout this website. We accept no responsibility for the accuracy of statements or information presented or liability for any and all actions that may consequently arise.
yelo.privacyPolicy.accuracyDesc.text.ar=مع بذل المحاولات في سبيل جعل كل المعلومات المقدمة في هذا الموقع من حيث دقتها وفائدتها، لا تضمن شركة يلو محتوى أو دقة المواد التي يمكن الوصول إليها عبر هذا الموقع أو السيرفر المستضيف. ومن أجل الحفاظ على هوية وخصوصية موظفينا والأسماء المستعارة والمجازية المستخدمة في هذا الموقع. وعليه لا نتحمل أي مسئولية دقة البيانات، أو المعلومات المقدمة، أو مسئولية عواقبها.

alyam.privacyPolicy.firstParagrapgh.text.en=At Al Yam, we prioritize your privacy and are committed to protecting your personal information. This Privacy Policy outlines how we collect, use, and protect your data when you interact with our website and mobile app. We adhere to global standards for data protection and privacy, and we encourage you to review this policy to understand how your information is managed.
alyam.privacyPolicy.firstParagrapgh.text.ar=في Al Yam، نلتزم بحماية خصوصيتك ومعلوماتك الشخصية. توضح سياسة الخصوصية هذه كيفية جمع بياناتك واستخدامها وحمايتها عند تفاعلك مع موقعنا الإلكتروني وتطبيق الهاتف المحمول.. نلتزم بالمعايير العالمية لحماية البيانات والخصوصية، ونأمل مراجعة هذه السياسة لفهم كيفية إدارة معلوماتك.
