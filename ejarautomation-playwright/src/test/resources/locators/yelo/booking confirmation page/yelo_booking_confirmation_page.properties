yelo.register.message3.text.en=Please note that any changes in your reservation could result in charges applicable by policy and availability. If you wish to cancel this reservation please go to link or send email to: reservation@iYelo.com If you have any questions please feel free to contact us: info@iyelo.com or call customer care number 8001000014
