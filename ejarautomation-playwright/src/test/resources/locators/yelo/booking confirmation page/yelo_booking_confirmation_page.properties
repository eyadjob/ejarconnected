yelo.register.message4.text.en=The Estimated Rental Price includes the total of all known rates, fees, surcharges and applicable drop off charges that you must pay either by law or by local policy for the length of a particular car rental request. This price does not include optional services such as insurance waivers, special equipment, mileage charges, or gasoline etc. It also does not include extra day or hour charges that can result from a late return of the rental car. It also does not include taxes (or VAT). This price is provided so you can better estimate the total price you may pay to the rental car company for your car, but is not a guarantee of your total charges
yelo.register.message4.text.ar=تشمل القيمة التقديرية للإيجار القيمة المعلومة لكافة الأجور والرسوم والتكاليف والمستحقات المنصوص عليها بالقوانين و/أو السياسات المحلية لمدة الايجار التقديرية. لا تشمل هذه القيمة التقديرية تكلفة الخدمات الإضافية مثل تنازل التأمين والمعدات الخاصة وأجور الأميال والوقود وغيرها. كما لا تشمل هذه القيمة التقديرية الأجور الإضافية للأيام أو الساعات الإضافية والتي قد تنتج عن تأخير إعادة المركبة, ولا تشمل هذه القيمة التقديرية ضريبة القيمة المضافة. تم توفير هذه القيمة التقديرية لمنح العميل فكرة أفضل عن التكلفة الإجمالية التي قد يدفعها لشركة تأجير السيارات مقابل الحصول على المركبة المرغوبة دون أية ضمانات للقيمة الإجمالية الفعلية للإيجار
