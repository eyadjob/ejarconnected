yelo.category.sedan.firstSectionParag.text.en=Different sizes of cars with plenty of space, perfect for in-city rides and to travel to any nearby city with your family, convenient trunk space, and affordable fuel consumption. This category is suitable when it comes to daily rides for families with more than two members.
yelo.category.sedan.firstSectionParag.text.ar=نوفر لك في هذه الفئة مجموعة متنوعة سيارات بمساحات تتناسب مع احتياجاتك المختلفة إن كانت للتجوال داخل المدينة أو للسفر ما بين المدن القريبة مع العائلة حيث أنها تتميز بمساحة تخزينية مناسبة، وكفائة صرف وقود معتدلة، تعد هذه الفئة الافضل للعائلات الصغيرة.
