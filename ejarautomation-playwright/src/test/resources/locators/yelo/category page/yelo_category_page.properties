yelo.category.footerTitleDesc.text.en=Whether you need an affordable car to get around town, a sedan for a vacation to travel comfortably with family or SUV and luxury to explore the roads in style & space with your friends you’ll find the perfect vehicle in our renewed fleet with the latest top automotive brands.
yelo.category.footerTitleDesc.text.ar=سواء كنت بحاجة إلى سيارة صغيرة و اقتصادية للتنقل بكفاءة ، أو سيارة سيدان او SUV لقضاء رحلات مريحة و ممتعة مع عائلتك أو الأصدقاء أو سيارة فاخرة للتميز في مناسباتك الخاصة ، ستجد سيارتك المثالية لذلك دائما في أسطولنا المميز والمتجدد.
