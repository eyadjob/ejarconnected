yelo.category.luxury.firstSectionParag.text.en=Defined by extravagant features and exaggerated comfort.\nLuxury cars are designed by high-end brands to complement your need for elegance and prestige and give an executive, luxurious, and premium vibe.\npick your choice and enjoy the seamless class that a luxury car offers.
yelo.category.luxury.firstSectionParag.text.ar=استمتع بالراحة التامة و تجربة تنقل لا مثيل لها، نوفر لك في هذه الفئة سيارات فخمة من مختلف العلامات التجارية الشهيرة لتلبي احتياجاتك في أوقاتك المميزة. اختر سيارتك المناسبة من هذه الفئة وتمتع بالتجربة الخاصة والحضور اللافت.
