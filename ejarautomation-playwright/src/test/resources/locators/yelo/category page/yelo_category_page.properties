yelo.category.crossOver.firstSection.text.en=SUV & Crossover
yelo.category.crossOver.firstSection.text.ar=دفع رباعي & كروس اوفر
yelo.category.crossOver.firstSectionParag.text.en=Looking for a large room and a suitable trunk for trips? This category is your perfect choice, with multiple options of cars and seats (5-7) so that no matter how big your family is, you can travel safely and relaxed. Enjoy the attached entertainment and sound system to live the ultimate experience. Simply, it is a car with more room and comfort for everyone, exploring a variety of vehicles that fit your needs.
yelo.category.crossOver.firstSectionParag.text.ar=تبحث عن مساحة واسعة و سعة تخزينية كبيرة للرحلات؟ هذه الفئة هي خيارك المفضل. سيارات بسعة تصل لـ سبع ركاب، مهما كانت عائلتك كبيرة، يمكنك الان السفر و التجوال براحة وأمان. يمكنك أيضًا الاستمتاع بنظام الترفيه الموجود في السيارة لتحظى أنت ومن برفقتك بتجربة سفر مميزة. بكل بساطة، سيارة تتسع للجميع، مريحة ومتعددة الاستخدامات.
