yelo.category.van.firstSection.text.en=Van & Pickups
yelo.category.van.firstSection.text.ar=فان & بيك أب
yelo.category.van.firstSectionParag.text.en=Vans: \nPlanning a trip for your big family? Stay together, and enjoy the ride with a room for 15 people and their luggage. Chants, food, and stories sharing all in one vehicle and one trip.\n\nPickups: \nA multi-purpose beast, waiting for you to unleash its powers, no matter what the landscape is, this vehicle will obey all your demands uphill or down, or just for casual in-city transportation.
yelo.category.van.firstSectionParag.text.ar=ڤان\nتخطط لرحلة مع عائلتك الكبيرة؟ تنقلّوا معًا و استمتعوا بالسفر بمقصورة تتسع ل خمسة عشر شخصًا بلإضافة لأمتعتهم. شارك الطعام المزاح والقصص المسلية مع عائلتك في نفس السيارة ونفس الرحلة.\n\nبيك أب\nسيارة متعددة الاستعمالات، جاهزة تمامًا لأصعب التحديات مهما كانت التضاريس، هذه السيارة تلبي جميع احتياجتك في أعلى التلال وأدناها. أو حتى بقيادة عادية داخل المدينة.
