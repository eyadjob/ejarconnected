alyam.membership.mainP.text.en=Alyam membership ( ALyam Loyalty Prgram) exceeds the concept of earning and redeeming Points. We have 4 tiers of members and based on their tier; our members benefit of discounts with our partners. We are working on having various partners ranging from airline companies, hotels, to restaurants and gyms.
alyam.membership.mainP.text.ar=عضوية اليم برنامج الولاء تتجاوز مفهوم كسب النقاط واستبدالها. لدينا 4 مستويات من الأعضاء وعلى أساس مستواهم ؛ يستفيد أعضاؤنا من الخصومات مع شركائنا. نحن نعمل على امتلاك شركاء مختلفين بدءًا من شركات الطيران والفنادق والمطاعم والصالات الرياضية.

