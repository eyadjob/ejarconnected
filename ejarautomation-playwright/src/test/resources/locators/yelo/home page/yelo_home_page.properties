yelo.homepage.categories.smallcarsDescription.span.text.en=Looking for a day-to-day car for business and\\or daily necessities? This category is offering affordable cars that don't break the budget, good choice for short trips and are fuel-efficient to save more money.
yelo.homepage.categories.smallcarsDescription.span.text.ar=تبحث عن سيارة يومية للتنقلات اليومية والذهاب إلى العمل؟ هذه الفئة توفر لك سيارات بأسعار مناسبة لميزانيتك، تعتبر الخيار الأمثل للرحلات القصيرة والرحلات داخل المدينة لكفائتها في صرف الوقود وسهولة الاصطفاف.
yelo.homepage.categories.electricDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'Electric') or contains(.,'كهربائية'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.electricDescription.span.text.en=Innovative and sustainable, driving towards a future of eco-conscious mobility.
yelo.homepage.categories.electricDescription.span.text.ar=سيارات صديقة للبيئة، تحاكي مستقبل التنقلات
yelo.homepage.categories.sedanDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'Sedan & compact') or contains(.,'سيدان & كومباكت'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.sedanDescription.span.text.en=Different sizes of cars with plenty of space, perfect for in-city rides and to travel to any nearby city with your family, convenient trunk space, and affordable fuel consumption. This category is suitable when it comes to daily rides for families with more than two members.
yelo.homepage.categories.sedanDescription.span.text.ar=نوفر لك في هذه الفئة مجموعة متنوعة سيارات بمساحات تتناسب مع احتياجاتك المختلفة إن كانت للتجوال داخل المدينة أو للسفر ما بين المدن القريبة مع العائلة حيث أنها تتميز بمساحة تخزينية مناسبة، وكفائة صرف وقود معتدلة، تعد هذه الفئة الافضل للعائلات الصغيرة.
yelo.homepage.categories.SUVDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'SUV & Crossover') or contains(.,'دفع رباعي & كروس اوفر'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.SUVDescription.span.text.en=Looking for a large room and a suitable trunk for trips? This category is your perfect choice, with multiple options of cars and seats (5-7) so that no matter how big your family is, you can travel safely and relaxed. Enjoy the attached entertainment and sound system to live the ultimate experience. Simply, it is a car with more room and comfort for everyone, exploring a variety of vehicles that fit your needs.
yelo.homepage.categories.SUVDescription.span.text.ar=تبحث عن مساحة واسعة و سعة تخزينية كبيرة للرحلات؟ هذه الفئة هي خيارك المفضل. سيارات بسعة تصل لـ سبع ركاب، مهما كانت عائلتك كبيرة، يمكنك الان السفر و التجوال براحة وأمان. يمكنك أيضًا الاستمتاع بنظام الترفيه الموجود في السيارة لتحظى أنت ومن برفقتك بتجربة سفر مميزة. بكل بساطة، سيارة تتسع للجميع، مريحة ومتعددة الاستخدامات.
yelo.homepage.categories.sportDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'Sport & Coupe') or contains(.,'رياضية & كوبيه'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.sportDescription.span.text.en=Cars designed to give optimal performance at high speed and the thrill of driving
yelo.homepage.categories.sportDescription.span.text.ar=عش التجربة المثلى بسيارة رياضية وأنيقة والتي توفر لك الفرصة لتطلق عنانك بتجربة قيادة ممتعة مليئة بالحماس، اذا كنت من عشاق القيادة والسيارات ذات الطابع الرياضي، فلا تتردد بتجربة سيارة من هذه الفئة.
yelo.homepage.categories.luxuryDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'Luxury') or contains(.,'فخمة'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.luxuryDescription.span.text.en=Defined by extravagant features and exaggerated comfort. Luxury cars are designed by high-end brands to complement your need for elegance and prestige and give an executive, luxurious, and premium vibe. pick your choice and enjoy the seamless class that a luxury car offers.
yelo.homepage.categories.luxuryDescription.span.text.ar=استمتع بالراحة التامة و تجربة تنقل لا مثيل لها، نوفر لك في هذه الفئة سيارات فخمة من مختلف العلامات التجارية الشهيرة لتلبي احتياجاتك في أوقاتك المميزة. اختر سيارتك المناسبة من هذه الفئة وتمتع بالتجربة الخاصة والحضور اللافت.
yelo.homepage.categories.familyDescription.span.byxpath=//div[contains(@class,"category-name") and (contains(.,'Family') or contains(.,'عائلية'))]/following-sibling :: div[contains(@class,"text-center")]/span
yelo.homepage.categories.familyDescription.span.text.en=Planning a trip for your family? Enjoy the ride with a room for all family members and their luggage. Chants, food, and stories sharing– all in one vehicle and one trip
yelo.homepage.categories.familyDescription.span.text.ar=خطط رحلتك واستمتع بسيارة تتسع لجميع أفراد العائلة وحقائبهم. شارك القصص الجميلة، الطعام، والأجواء العائلية الجميلة في مكان واحد ورحلة واحدة.
