automatedRentalAgentReport.email.body=<!DOCTYPE html>\
<html lang="en">\
<head>\
    <meta charset="utf-8">\
    <meta name="viewport" content="width=device-width, initial-scale=1.0">\
   <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>\
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>\
    <title>Automated Rental Regression Test Report</title>\
    <style>\
        body {\
            text-align: center;\
            background-color: white;\
            font-family: sans-serif;\
        }\
\
        .collapsible {\
            background-color: #777;\
            color: white;\
            cursor: pointer;\
            padding: 18px;\
            width: 100%;\
            border: none;\
            text-align: left;\
            outline: none;\
            font-size: 15px;\
        }\
\
        .active, .collapsible:hover {\
            background-color: #555;\
        }\
\
        .collapsible:after {\
            content: '\002B';\
            color: white;\
            font-weight: bold;\
            float: right;\
            margin-left: 5px;\
        }\
\
        .collasibleContent {\
            padding: 1px;\
            max-height: 0;\
            overflow: hidden;\
            transition: max-height 0.2s ease-out;\
            background-color: #f1f1f1;\
            text-align: left;\
        }\
\
        .active:after {\
            content: "\2212";\
        }\
   .scenarioTitle {\
            border: 0px solid #BBBBBB;\
            background-color: white;\
            border-bottom: 1px #B7B7B7 solid;\
            width: 10%;\
            border-spacing: 2px;\
            /*text-align: left ;*/\
            font-weight: bold;\
            vertical-align: left;\
            font-size: 14px !important;\
            border: solid windowtext 1.0pt; \
           background-color:  #A9A9A9\
}\
        .automatedResultTable {\
            border: 0px solid #BBBBBB;\
            background-color: white;\
            border-bottom: 1px #B7B7B7 solid;\
            margin-left:10px;\
            margin-right:10px;\
             margin-bottom:10px;\
            border-spacing: 2px;\
            border: solid windowtext 1.0pt;\
        }\
\
        .automatedResultTable th {\
            padding-bottom: 3px !important;\
            text-align: center;\
            padding-top: 3px !important;\
            padding-left: 5px !important;\
            padding-right: 5px !important;\
            vertical-align: left !important;\
            background-color: #148ACA;\
            color: white;\
            font-size: 12px;\
            font-weight: normal;\
        }\
        \
        .automatedResultTable td {\
            padding-bottom: 3px !important;\
            text-align: center;\
            padding-top: 3px !important;\
            padding-left: 3px !important;\
            padding-right: 5px !important;\
            vertical-align: middle !important;\
            font-size: 12px;\
            border: solid windowtext 0.2pt;\
        }\
\
        .baseHeader {\
            font-size: 28px;\
            font-weight: bold;\
            color: #500788;\
            margin: 0;\
        }\
\
        .contentSlideDiv {\
            padding-top: 0px !important;\
        }\
\
        .TxtAr {\
            direction: rtl;\
            margin-left: 5px;\
            text-align: right;\
        }\
\
        .TxtAr .baseHeader {\
            text-align: right;\
        }\
\
        .TxtEn {\
            direction: ltr;\
            margin-right: 5px;\
            text-align: left;\
        }\
\
        .text {\
            text-align: justify;\
        }\
\
        .detail {\
            font-size: 21px;\
        }\
\
        .middleDiv {\
            margin-left: 15px;\
            margin-right: 15px;\
            width: 20%;\
            padding-left: 0px;\
            padding-right: 0px;\
            vertical-align: middle;\
        }\
\
        .reportDate {\
            padding-left: 10px;\
            text-align: left;\
        }\
\
        .reportDate th {\
            text-align: left;\
            vertical-align: top;\
        }\
\
        .reportDate td {\
            padding-left: 0px;\
        }\
\
        #UpperLogo {\
            background-color: white;\
            color: #505050;\
        }\
\
        .testCasesStatusPieChartId {\
            background-color: white;\
            color: #505050;\
        }\
\
        #table1, #table2, #table3 {\
            border: none;\
            background-color: white;\
        }\
\
        #table1 td, #table2 td, #table3 td, #automatedResultTable td {\
            padding-top: 25px;\
            padding-bottom: 20px;\
            padding-left: 20px;\
            padding-right: 20px;\
            vertical-align: text-top;\
        }\
\
        .img {\
            padding-bottom: 10px;\
            max-width: 600px;\
            height: 146px;\
        }\
\
        .halfWidth {\
            width: 40%;\
        }\
\
        .contentDetails {\
            border: 10px solid #148ACA;\
            font-size: 27px;\
        }\
\
        .orangeText {\
            color: #500788;\
        }\
\
        .centeredText {\
            text-align: center;\
        }\
\
        #mainTable {\
            border: 1px solid #B7B7B7;\
            background-color: #091828;\
            width: 100%;\
        }\
\
        #mainTable .mainTableTD {\
            padding-right: 20px;\
            padding-left: 20px;\
            padding-top: 0px;\
        }\
\
        #callUsTable td {\
            padding: 0px;\
        }\
\
        .mainBtnTable {\
            -ms-border-radius: 5px;\
            border-radius: 5px;\
            background-color: #500788;\
        }\
\
        .mainBtnTable td {\
            padding-bottom: 0px !important;\
            text-align: center;\
            padding-top: 0px !important;\
            padding-left: 2px !important;\
            padding-right: 5px !important;\
            vertical-align: middle !important;\
        }\
\
        .mainBtnTable a {\
            text-decoration: none;\
            color: #FFCD00;\
        }\
\
        .SidesDiv {\
            width: 40%;\
            vertical-align: bottom !important;\
            padding-bottom: 0px !important;\
        }\
\
        #upperTable {\
            border: 0px solid #BBBBBB;\
            background-color: white;\
            border-bottom: 3px #B7B7B7 solid;\
            width: 100%;\
        }\
\
        #upperTable td {\
            padding-top: 11px;\
        }\
\
        #imgFooterTD {\
            text-align: center;\
            padding-top: 45px;\
            padding-bottom: 45px;\
            height: 66px;\
        }\
\
        #imgFooterTD img {\
            max-width: 21%;\
        }\
\
        #UpperLogo img {\
            max-width: 31%;\
        }\
\
        #welcomeRegistrationTable {\
            direction: ltr;\
            padding-right: 27px;\
            padding-left: 27px;\
            padding-top: 10px;\
            padding-bottom: 15px;\
            background-color: white;\
            font-size: 26px;\
        }\
\
        #welcomeRegistrationSubTable {\
            padding-bottom: 20px;\
            padding-top: 11px;\
        }\
\
        .mediaShare img {\
            width: 50px;\
            height: 50px;\
            display: inline-block;\
        }\
\
        .mediaShare a {\
            text-decoration: none;\
            border: none;\
        }\
\
        .mediaShare span {\
            padding-right: 8px;\
            padding-left: 8px;\
        }\
\
        .passed { \
            color: #009900 !important; \
            font-weight: bold; \
        }\
\
        .error, .failed { \
            color: red !important; \
            font-weight: bold; \
        }\
\
        .summaryText {\
            color: black;\
            font-size: 20px;\
            font-weight:bold;\
            margin-top: 10px; \
        }\
    </style>\
</head>\
<body>\
    <table width="90%" align="center">\
        <tbody>\
            <tr>\
                <td>\
                    <table id="upperTable" width="100%" align="center">\
                        <tbody>\
                            <tr>\
                                <td>\
                                    <div id="UpperLogo">\
                                        <img src="cid:high-logo" alt="Yelo">\
                                    </div>\
                                </td>\
                            </tr>\
                        </tbody>\
                    </table>\
                    \
                    <table id="mainTable">\
                        <tbody>\
                            <tr>\
                                <td height="20"></td>\
                            </tr>\
                            <tr>\
                                <td class="mainTableTD">\
                                    <table id="welcomeRegistrationTable" border="0" cellpadding="0" cellspacing="0" width="100%">\
                                        <tbody>\
                                            <tr>\
                                                <td class="centeredText">\
                                                    <h1 class="orangeText" style="font-size: 30px; margin-top: 20px; color:black">\
                                                        Automated Rental Agent Regression Test Report\
                                                    </h1>\
                                                </td>\
                                            </tr>\
                                            <tr>\
                                                <td class="centeredText" style="font-size: 16px;padding-bottom: 23px; font-weight:bold">\
                                                    ScriptNameToReplace\
                                                </td>\
                                            </tr>\
                                            <tr>\
                                                <td>\
                                                    <table class="contentDetails" id="welcomeRegistrationSubTable" height="200" align="center" width="100%">\
                                                        <tbody>\
                                                            <tr>\
                                                                <td>\
                                                                    <div id="testCasesStatusPieChartId">\
                                                                        <img src="cid:testCasesStatusPieChart-icon" alt="testCasesTstatus">\
                                                                    </div></br>\
                                                                </td>\
                                                            </tr>\
                                                                <tr>\
                                                                <td  class="orangeText" style='text-align: center;font-size:16px;color:black' >Test Start / End / Elapsed:<span style='text-align: left; color: blue;font-weight:normal;font-size:15px'> TestTimeToReplace</span></td>\
                                                            </tr>\
                                                              <tr>\
                                                                 <td  class="orangeText" style='text-align: center;font-size:16px;color:black'>Report File Path:<span style='text-align: left; color: blue;font-weight:normal;font-size:15px'> ReportFilePathToReplace</span></td>\
                                                               </tr>\
                                                                <tr>\
                                                                 <td  class="orangeText" style='text-align: center;font-size:16px;color:black'>Execution Environment:<span style='text-align: left; color: blue;font-weight:normal;font-size:15px'> ExecutionEnvironmentToReplace</span></td>\
                                                               </tr>\
                                                          </td>\
                                            </tr>\
                                            <tr>\
                                                <td colspan="2">\
                                                    <table class="reportDate" style="font-size: 15px; margin-top: 1px;">\
                                                        <tbody></br>automatedRentalAgentResultSummary</tbody>\
                                                    </table>\
                                                </td>\
                                            </tr>\
                                        </tbody>\
                                    </table>\
                                </td>\
                            </tr>\
                            <tr>\
                                <td class="mainTableTD">\
                                    <table id="table3" width="100%" align="center" style="background-color: #4D0970">\
                                        <tbody>\
                                            <tr>\
                                                <td colspan="2" class="TxtEn halfWidth">\
                                                    <div class="detail" style="font-size: 12px; color: white; font-family: sans-serif; font-size:15px">\
                                                        © {{currentYear}} Yelo is an innovator for the mobility industry, specialized in developing solutions and services to manage fleet and Rent a Car busines.\
                                                    </div>\
                                                </td>\
                                                <td colspan="2" class="TxtAr halfWidth">\
                                                    <div class="detail" style="direction: rtl; font-size: 12px; color: white; font-family: sans-serif; font-size:15px">\
                                                      \
                                                        <span style="font-size: 12px">&copy; {{currentYear}}</span>جميع الحقوق محفوظ © {{currentYear}} نحن يلو، المبتكرون في مجال التنقل، نتخصص في مجال صناعة وتطوير الحلول البرمجية لإدارة أسطول السيارات وإدارة حلول تأجير السيارات\
                                                    </div>\
                                                </td>\
                                            </tr>\
                                        </tbody>\
                                    </table>\
                                    \
                                    <table id="table3" width="100%" align="center" style="background-color:#4D0970">\
                                        <tbody>\
                                            <tr>\
                                                <td width="100%">\
                                                    <div class="detail" style="direction: ltr; font-size: 12px; color: white; font-family: sans-serif; font-size:15px">\
                                                        <span>\
                                                            <img src="cid:email" style="direction: ltr;width:25px; height:25px;"/>\
                                                            &nbsp;info@iyelo.com&nbsp;&nbsp;&nbsp;\
                                                        </span>\
                                                        <span>\
                                                            <img src="cid:mobile" alt="mobile" style="direction: ltr;width:25px; height:25px;" />\
                                                            &nbsp;+966 11 2848 244&nbsp;&nbsp;&nbsp;\
                                                        </span>\
                                                        <span>\
                                                            <img src="cid:location" alt="location" style="direction: ltr;width:25px; height:25px;" />\
                                                            &nbsp;Saudi Arabia, Riyadh, Al Yasmeen, Al Ulaya.&nbsp;\
                                                        </span>\
                                                    </div>\
                                                </td>\
                                            </tr>\
                                          </tbody>\
                                       </table>\
                                  </tbody>\
                                </table>\
                                </td>\
                            </tr>\
                            <tr>\
                                <td height="20"></td>\
                            </tr>\
                        </tbody>\
                    </table>\
                </td>\
            </tr>\
        </tbody>\
    </table>\
\
    <script>\
        var coll = document.getElementsByClassName("collapsible");\
        var i;\
        \
        for (i = 0; i < coll.length; i++) {\
            coll[i].addEventListener("click", function() {\
                this.classList.toggle("active");\
                var content = this.nextElementSibling;\
                \
                if (content.style.maxHeight) {\
                    content.style.maxHeight = null;\
                } else {\
                    content.style.maxHeight = content.scrollHeight + "px";\
                } \
            });\
        }\
    </script>\
</body>\
</html>